<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>привет</title>
<style>
  /* Розовая лента у IP, красная у финала. */
  :root { --bg: #070708; --fg: #efece6; --dim: #77736d; --pink: #ff4fd8; --red: #ff2e4d; --card: #151517; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.3 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    min-height: 100vh; overflow-x: hidden;
  }

  /* ---------- шапка: IP на ленте ---------- */
  #page { overflow-x: clip; }
  #hero { position: relative; height: 46vw; max-height: 340px; margin: 9vh 0 2vh; transform: rotate(-10deg); }
  #tape {
    position: absolute; left: -10vw; right: -10vw; top: 50%; height: 1.45em; transform: translateY(-50%) translateX(-110%);
    background: var(--pink);
    clip-path: polygon(0 8%, 3% 0, 97% 6%, 100% 0, 99% 92%, 96% 100%, 2% 94%, 0 100%);
  }
  #hero.in #tape { animation: tape .28s cubic-bezier(.7, 0, .3, 1) forwards; }
  @keyframes tape { to { transform: translateY(-50%) translateX(0); } }
  #ip {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%) scale(2.4); opacity: 0;
    text-align: center; font-weight: 800; letter-spacing: -.04em; color: #0b0b0c; white-space: nowrap;
  }
  #hero.in #ip { animation: drop .26s .22s cubic-bezier(.3, 1.5, .5, 1) forwards; }
  @keyframes drop { to { transform: translateY(-50%) scale(1); opacity: 1; } }
  #where {
    position: absolute; left: 0; right: 0; top: calc(50% + .75em); text-align: center;
    font-size: 15px; color: var(--fg); opacity: 0;
  }
  #hero.in #where { animation: fade .3s .55s forwards; }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- середина: стикеры ---------- */
  #board { display: flex; flex-wrap: wrap; gap: 14px 10px; padding: 4vh 5vw 6vh; max-width: 900px; margin: 0 auto; }
  .st {
    background: var(--card); padding: .55em .8em .6em; border-left: 3px solid var(--fg);
    flex: 1 1 auto; max-width: 100%; opacity: 0; transform: rotate(var(--r)) scale(1.7);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .6);
  }
  .st.in { animation: stamp .2s cubic-bezier(.3, 1.4, .5, 1) forwards; }
  @keyframes stamp { to { opacity: 1; transform: rotate(var(--r)) scale(1); } }
  .st .k { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: .25em; }
  .st .v { display: block; font-size: 17px; }
  .st.big { flex-basis: 100%; border-left-color: var(--pink); }
  .st.big .v { font-size: clamp(22px, 6.4vw, 40px); font-weight: 700; letter-spacing: -.02em; }
  .st.big .s { display: block; font-size: 13px; color: var(--dim); margin-top: .3em; }
  .st.small .v { font-size: 14px; }
  .st { position: relative; }
  .st .v.struck {
    display: inline; -webkit-box-decoration-break: clone; box-decoration-break: clone;
    color: var(--dim); background: linear-gradient(var(--red), var(--red)) no-repeat 0 55% / 100% 4px;
    animation: strike .25s ease-out;
  }
  @keyframes strike { from { background-size: 0 4px; } }
  .st .t { display: block; font-size: clamp(20px, 5.6vw, 34px); font-weight: 700; margin-top: .2em; }
  .stamp {
    position: absolute; right: .7em; top: .55em; padding: .05em .4em; border: 3px solid var(--red); color: var(--red);
    font-weight: 900; letter-spacing: .08em; font-size: clamp(16px, 4.6vw, 26px); opacity: 0; transform: rotate(-12deg) scale(2.6);
    z-index: 5; background: var(--card); box-shadow: 0 4px 14px rgba(0, 0, 0, .7);
  }
  /* Плашка со штампом поверх соседних, чтобы штамп ничем не перекрывался. */
  .st:has(.stamp) { z-index: 4; }
  .stamp.in { animation: stampin .18s cubic-bezier(.3, 1.4, .5, 1) forwards; }
  @keyframes stampin { to { opacity: 1; transform: rotate(-12deg) scale(1); } }
  .st.ticker { flex-basis: 100%; padding: .55em 0; overflow: hidden; white-space: nowrap; border-left: 0; color: var(--dim); font-size: 14px; transform: scale(1); }
  .st.ticker span { display: inline-block; animation: run 28s linear infinite; }

  /* ---------- финал: захват экрана ---------- */
  #final {
    position: fixed; inset: 0; background: rgba(5, 5, 6, 0); pointer-events: none; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  #final.in { animation: dark .35s forwards; pointer-events: auto; }
  @keyframes dark { to { background: rgba(5, 5, 6, .93); } }
  .police {
    position: absolute; left: -30vw; width: 160vw; top: 17%; padding: .35em 0;
    transform: rotate(-14deg) translateX(-120%);
    background: var(--red); color: #fff; font-weight: 900; font-size: clamp(22px, 7vw, 46px);
    white-space: nowrap; overflow: hidden;
    border-block: 6px solid; border-image: repeating-linear-gradient(45deg, #000 0 14px, var(--red) 14px 28px) 6;
  }
  .police.p2 { top: 76%; transform: rotate(9deg) translateX(120%); font-size: clamp(14px, 4vw, 24px); }
  #final.in .police { animation: cross .4s cubic-bezier(.7, 0, .3, 1) forwards; }
  #final.in .police.p2 { animation-delay: .25s; }
  @keyframes cross { to { transform: rotate(var(--a)) translateX(0); } }
  .police span { display: inline-block; animation: run 9s linear infinite; }
  .police.p2 span { animation-direction: reverse; }
  @keyframes run { to { transform: translateX(-50%); } }
  #verdict {
    position: relative; z-index: 2; width: 100%; padding: 0 7vw; text-align: center; opacity: 0;
    font-size: clamp(20px, 5.6vw, 34px); font-weight: 700; line-height: 1.25;
  }
  #verdict small { display: block; font-size: 14px; font-weight: 400; color: var(--dim); margin-top: .8em; }
  #final.in #verdict { animation: fade .3s .75s forwards; }
  #final.out { animation: undark .45s forwards; pointer-events: none; }
  @keyframes undark { from { background: rgba(5, 5, 6, .93); } to { background: rgba(5, 5, 6, 0); } }
  #final.out .police { animation: leave .4s cubic-bezier(.7, 0, .3, 1) forwards; }
  #final.out .police.p2 { animation-name: leave2; }
  @keyframes leave { from { transform: rotate(var(--a)) translateX(0); } to { transform: rotate(var(--a)) translateX(130%); } }
  @keyframes leave2 { from { transform: rotate(var(--a)) translateX(0); } to { transform: rotate(var(--a)) translateX(-130%); } }
  #final.out #verdict { opacity: 1; animation: unfade .25s forwards; }
  @keyframes unfade { to { opacity: 0; } }
  .st.verdict { border-left-color: var(--red); background: #24090e; }
  .st.verdict .k { color: var(--red); }
  #ask {
    display: block; margin: 0 auto 14vh; opacity: 0;
    font: inherit; font-size: clamp(15px, 4vw, 20px); color: #000; background: var(--fg);
    border: 0; padding: .8em 1.2em; cursor: pointer; transform: rotate(-2deg); max-width: 86vw;
  }
  #ask.in { animation: fade .3s forwards; }
  #ask:hover, #ask:active { background: var(--pink); }

  /* ---------- экран 2: повтор записи ---------- */
  #page { position: relative; }
  .rec #hero, .rec #board { filter: grayscale(1) brightness(.5); }
  #trace { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .dot {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 14px var(--red); animation: dotfade .9s forwards;
  }
  @keyframes dotfade { to { opacity: 0; transform: scale(.4); } }
  .mark {
    position: absolute; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; padding: .1em .45em;
    white-space: nowrap; opacity: 0; translate: -100% 0; transform: rotate(-6deg) scale(2.2); box-shadow: 0 4px 14px rgba(0, 0, 0, .7);
  }
  .mark.in { animation: markin .18s cubic-bezier(.3, 1.4, .5, 1) forwards; }
  @keyframes markin { to { opacity: 1; transform: rotate(-6deg) scale(1); } }
  #recov {
    position: fixed; inset: 0; z-index: 8; display: none; touch-action: none; overflow: hidden;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 2px, transparent 2px 4px);
  }
  #recov.on { display: block; }
  #recov.vhs::after {
    content: ''; position: absolute; left: 0; right: 0; height: 22vh;
    background: linear-gradient(transparent, rgba(255, 255, 255, .13), transparent); animation: band .3s linear infinite;
  }
  @keyframes band { from { top: -25vh; } to { top: 100vh; } }
  #recbadge {
    position: absolute; left: 5vw; top: 4vh; border: 3px solid var(--red); color: var(--red); background: rgba(5, 5, 6, .85);
    font-weight: 900; letter-spacing: .08em; font-size: clamp(16px, 4.6vw, 24px); padding: .1em .5em; transform: rotate(-4deg);
  }
  #recbadge .rdot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: var(--red); margin-right: .4em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #recbadge .tc { color: var(--fg); font-weight: 400; margin-left: .7em; }
  #ask.counting { background: var(--red); color: #fff; font-weight: 800; transform: rotate(-2deg) scale(1.15); }
  #after { max-width: 760px; margin: -6vh auto 0; padding: 0 6vw 18vh; }
  #after p { margin: 0 0 .9em; opacity: 0; transform: translateX(-10vw); font-size: clamp(18px, 5vw, 28px); font-weight: 700; line-height: 1.25; }
  #after p.in { animation: slide .22s cubic-bezier(.3, 1.4, .5, 1) forwards; }
  @keyframes slide { to { opacity: 1; transform: none; } }
  #after p.small { font-size: 15px; font-weight: 400; color: var(--dim); }

  /* ---------- тряска и вспышка ---------- */
  .shake1 { animation: sh1 .18s linear; }
  .shake2 { animation: sh2 .3s linear; }
  .shake3 { animation: sh3 .5s linear; }
  @keyframes sh1 { 25% { translate: 2px -1px; } 75% { translate: -2px 1px; } }
  @keyframes sh2 { 20% { translate: -7px 3px; } 40% { translate: 6px -4px; } 60% { translate: -4px 2px; } 80% { translate: 2px -1px; } }
  @keyframes sh3 {
    10% { translate: -16px 7px; rotate: -1deg; } 20% { translate: 13px -9px; rotate: .8deg; } 35% { translate: -10px 4px; }
    50% { translate: 8px -5px; rotate: -.4deg; } 65% { translate: -5px 3px; } 80% { translate: 3px -2px; }
  }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: #fff; mix-blend-mode: difference; z-index: 9; }
  #flash.go { animation: fl .16s ease-out; }
  #flash.red { background: var(--red); mix-blend-mode: normal; }
  @keyframes fl { 0% { opacity: .85; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .shake1, .shake2, .shake3, #flash.go, .police span { animation: none; } }
</style>
</head>
<body>
<div id="flash"></div>
<div id="page">
<header id="hero"><div id="tape"></div><div id="ip"></div><div id="where"></div></header>
<main id="board"></main>
<button id="ask">Хочешь узнать, как такое вообще возможно?</button>
<section id="after"></section>
<div id="trace"></div>
</div>
<div id="recov"><div id="recbadge"><span class="rdot"></span>ЗАПИСЬ<span class="tc">00:00</span></div></div>
<section id="final">
  <div class="police" style="--a:-14deg"><span></span></div>
  <div class="police p2" style="--a:9deg"><span></span></div>
  <div id="verdict"></div>
</section>
<script>
// Ничего не отправляется и не сохраняется. Единственный внешний запрос: ipwho.is, чтобы узнать город по IP.
const wait = ms => new Promise(r => setTimeout(r, ms));
const timeout = (p, ms) => Promise.race([p, wait(ms).then(() => null)]);
const ua = navigator.userAgent;
const $ = id => document.getElementById(id);

// ---------- запись: как ты читаешь эту страницу (живёт только в памяти вкладки) ----------
const rec = { t0: performance.now(), scroll: [[performance.now(), scrollY]], touch: [], tilt: [], grav: [], askIn: 0, askSeen: 0, almost: 0, leaves: 0, done: false };
let lastScroll = 0, lastTouch = 0;
addEventListener('scroll', () => {
  const n = performance.now();
  if (rec.done || n - lastScroll < 30) return;
  lastScroll = n;
  rec.scroll.push([n, scrollY]);
}, { passive: true });
function addTouch(x, y, force) {
  const n = performance.now();
  if (rec.done || (!force && n - lastTouch < 50)) return;
  lastTouch = n;
  rec.touch.push([n, x, y]);
}
addEventListener('touchstart', e => addTouch(e.touches[0].pageX, e.touches[0].pageY, true), { passive: true });
addEventListener('touchmove', e => addTouch(e.touches[0].pageX, e.touches[0].pageY), { passive: true });
addEventListener('mousemove', e => addTouch(e.pageX, e.pageY), { passive: true });
// В Телеграме датчик оживает только после первого касания, в Brave молчит совсем.
addEventListener('deviceorientation', e => { if (e.beta != null) rec.tilt.push([performance.now(), e.beta, e.gamma]); });
addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity;
  if (a && a.x != null) rec.grav.push([performance.now(), Math.atan2(a.y, a.z) * 180 / Math.PI, Math.atan2(-a.x, Math.hypot(a.y, a.z)) * 180 / Math.PI]);
});

const TZ_CITY = {
  'Europe/Moscow': 'Москве', 'Europe/Kaliningrad': 'Калининграду', 'Europe/Samara': 'Самаре',
  'Asia/Yekaterinburg': 'Екатеринбургу', 'Asia/Omsk': 'Омску', 'Asia/Novosibirsk': 'Новосибирску',
  'Asia/Barnaul': 'Барнаулу', 'Asia/Tomsk': 'Томску', 'Asia/Novokuznetsk': 'Новокузнецку',
  'Asia/Krasnoyarsk': 'Красноярску', 'Asia/Irkutsk': 'Иркутску', 'Asia/Chita': 'Чите',
  'Asia/Yakutsk': 'Якутску', 'Asia/Vladivostok': 'Владивостоку', 'Asia/Magadan': 'Магадану',
  'Asia/Kamchatka': 'Камчатке', 'Europe/Minsk': 'Минску', 'Europe/Kiev': 'Киеву', 'Europe/Kyiv': 'Киеву',
  'Asia/Almaty': 'Алматы', 'Asia/Tashkent': 'Ташкенту',
};
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
const tzName = TZ_CITY[tz] || tz.split('/').pop().replace(/_/g, ' ');

// ---------- сбор ----------
const ipInfo = timeout(fetch('https://ipwho.is/?lang=ru').then(r => r.json()).then(j => j.success ? j : null).catch(() => null), 3500);

const hints = navigator.userAgentData?.getHighEntropyValues
  ? timeout(navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion', 'fullVersionList']).catch(() => null), 1500)
  : Promise.resolve(null);

const rawBattery = navigator.getBattery ? timeout(navigator.getBattery().catch(() => null), 1500) : Promise.resolve(null);

function gpu() {
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    if (!gl) return null;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    let r = gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '';
    const m = r.match(/^ANGLE \(([^,]+),\s*(.+?)(?:,\s*[^,]*\))?$/);
    if (m) r = m[2];
    r = r.replace(/\(TM\)|\(R\)/g, '').replace(/\/PCIe.*$/, '').replace(/\s*\(0x[0-9a-f]+\)/i, '')
      .replace(/Direct3D.*$|OpenGL.*$|vs_\d.*$/i, '').replace(/\s+/g, ' ').trim();
    return r || null;
  } catch { return null; }
}
// Brave подменяет видеокарту, батарею, потоки и память, этим значениям не верим.
const BRAVE = !!navigator.brave;
const rawGpu = gpu();
const gpuName = BRAVE ? null : rawGpu;

// Firefox с защитой и Tor ставят часовой пояс UTC, по нему VPN не ловим.
const TZ_HIDDEN = !tz || /^(UTC|Etc\/)/.test(tz);

// Шум в холсте: заливаем квадрат одним цветом и читаем обратно. Честный браузер вернёт ровно этот цвет.
function canvasNoise() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d'); x.fillStyle = 'rgb(12,200,34)'; x.fillRect(0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    for (let i = 0; i < d.length; i += 4) if (d[i] !== 12 || d[i + 1] !== 200 || d[i + 2] !== 34) return true;
    return false;
  } catch { return null; }
}
const NOISE = canvasNoise();

// Замер ядер: сколько счёта успевает один поток и сколько шестнадцать разом.
// Малые ядра и гипертрединг занижают результат, поэтому пишем «не меньше».
let openGate;
const gate = new Promise(r => openGate = r);
const SUSPECT = BRAVE || NOISE || (navigator.hardwareConcurrency || 0) <= 4;
const measured = !SUSPECT ? Promise.resolve(null) : gate.then(() => timeout(new Promise(res => {
  try {
    const src = 'onmessage=e=>{const end=performance.now()+e.data;let n=0,x=0;while(performance.now()<end){for(let i=0;i<20000;i++)x+=Math.sqrt(i);n++}postMessage(n)}';
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const batch = k => Promise.all(Array.from({ length: k }, () => new Promise(r => {
      const w = new Worker(url); w.onmessage = e => { r(e.data); w.terminate(); }; w.postMessage(250);
    }))).then(a => a.reduce((s, v) => s + v, 0));
    batch(1).then(one => batch(16).then(all => res(one ? Math.floor(all / one) : null)));
  } catch { res(null); }
}), 2500));

// Процессор браузер не называет, но у телефонов его выдаёт видеоядро.
const ADRENO_CHIP = {
  840: 'Snapdragon 8 Elite Gen 5', 830: 'Snapdragon 8 Elite', 750: 'Snapdragon 8 Gen 3', 740: 'Snapdragon 8 Gen 2',
  735: 'Snapdragon 8s Gen 3', 730: 'Snapdragon 8 Gen 1', 660: 'Snapdragon 888', 650: 'Snapdragon 865',
  640: 'Snapdragon 855', '642L': 'Snapdragon 778G',
};
function chip() {
  const m = gpuName?.match(/Adreno\s*(\d+L?)/i);
  // Переносить можно только после «Snapdragon», остальное одним куском.
  if (m && ADRENO_CHIP[m[1]]) return ADRENO_CHIP[m[1]].replace(/ /g, '\u00a0').replace('Snapdragon\u00a0', 'Snapdragon ');
  if (/Apple GPU/.test(gpuName || '') && /Mac/.test(ua)) return 'Apple Silicon (M-серия)';
  return null;
}

// Настоящий IP через WebRTC: если туннель не берёт UDP, STUN покажет адрес мимо VPN.
const rtcIP = timeout(new Promise(res => {
  try {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.createDataChannel('x');
    pc.onicecandidate = e => {
      const m = e.candidate?.candidate.match(/(\d+\.\d+\.\d+\.\d+) \d+ typ srflx/);
      if (m) { res(m[1]); pc.close(); }
    };
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => res(null));
  } catch { res(null); }
}), 3000);

// Бренд по коду модели. Точное название по коду требует таблицы, пока только бренд и серия.
function brandOf(model) {
  const S = { S: 'Galaxy S', A: 'Galaxy A', F: 'Galaxy Z', M: 'Galaxy M', N: 'Galaxy Note', G: 'Galaxy S', X: 'Galaxy Tab', T: 'Galaxy Tab', E: 'Galaxy E' };
  let m;
  if ((m = model.match(/^SM-([A-Z])/))) return 'Samsung ' + (S[m[1]] || 'Galaxy');
  if (/^CPH\d/.test(model)) return 'OPPO или OnePlus';
  if (/^RMX\d/.test(model)) return 'realme';
  if (/^V2\d{3}/.test(model)) return 'vivo';
  if (/^(2\d{3}[A-Z0-9]{4,}|M2\d{3})/.test(model)) return 'Xiaomi, Redmi или POCO';
  if (/^[A-Z]{3}-[A-Z]{1,2}\d/.test(model)) return 'Huawei или Honor';
  return null;
}

async function device() {
  const h = await hints;
  if (/iPhone/.test(ua)) return { v: 'iPhone', s: 'iOS ' + ((ua.match(/OS (\d+[_\d]*)/) || [])[1] || '?').replace(/_/g, '.') };
  if (/iPad/.test(ua)) return { v: 'iPad' };
  if (/Android/.test(ua)) {
    const model = h?.model || ((ua.match(/Android [\d.]+; ([^;)]+)/) || [])[1] || '').replace(/\s*Build\/.*$/, '');
    const ver = h?.platformVersion || (ua.match(/Android ([\d.]+)/) || [])[1];
    const real = model && model !== 'K';
    const brand = real && brandOf(model);
    const os = 'Android ' + (ver || '').replace(/\.0(\.0)?$/, '');
    if (!real) return { v: os, s: 'модель браузер скрыл' };
    return { v: brand || model, s: [brand && model, os].filter(Boolean).join(', ') };
  }
  if (/Windows/.test(ua)) return { v: 'Windows ' + (h?.platformVersion && parseInt(h.platformVersion) >= 13 ? '11' : '10') };
  if (/Mac OS X/.test(ua)) return { v: 'Mac' };
  if (/Linux/.test(ua)) return { v: 'Linux' };
  return null;
}

async function browser() {
  const h = await hints;
  const list = h?.fullVersionList || navigator.userAgentData?.brands || [];
  const pick = n => list.find(b => b.brand.includes(n));
  const tg = /Telegram/i.test(ua) || window.TelegramWebviewProxy || window.TelegramWebview;
  const ya = pick('YaBrowser') || pick('Yandex') || /YaBrowser/.test(ua);
  // В WebView и Brave бренда «Chrome» нет, только «Chromium», поэтому версию движка берём из UA.
  const cv = ((pick('Google Chrome') || pick('Chromium') || {}).version || (ua.match(/Chrome\/(\d+)/) || [])[1] || '').split('.')[0];
  if (tg) return 'встроенный браузер Телеграма';
  if (/; wv\)/.test(ua) || pick('WebView')) return 'встроенный браузер приложения';
  const base = BRAVE ? 'Brave' : ya ? 'Яндекс Браузер' : pick('Edge') ? 'Edge' : pick('Opera') || /OPR\//.test(ua) ? 'Opera'
    : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /Firefox|FxiOS/.test(ua) ? 'Firefox'
    : /CriOS/.test(ua) || cv ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : null;
  return base ? base + (base === 'Chrome' && cv ? ' ' + cv : '') : null;
}

// ru-RU, en-RU, ru превращаем в «русский, английский».
function languages() {
  const tags = navigator.languages?.length ? navigator.languages : [navigator.language];
  let L, R;
  try { L = new Intl.DisplayNames(['ru'], { type: 'language' }); R = new Intl.DisplayNames(['ru'], { type: 'region' }); } catch { return tags.join(', '); }
  const langs = [], regions = [];
  for (const t of tags) {
    const [l, r] = t.split('-');
    const ln = L.of(l); if (ln && !langs.includes(ln)) langs.push(ln);
    if (r) { const rn = R.of(r.toUpperCase()); if (rn && !regions.includes(rn)) regions.push(rn); }
  }
  return langs.join(', ');
}

function netLine() {
  const c = navigator.connection;
  if (!c) return null;
  const parts = [];
  if (c.type && c.type !== 'unknown') parts.push(c.type === 'wifi' ? 'Wi-Fi' : c.type === 'cellular' ? 'мобильный' : c.type);
  if (c.downlink) parts.push('~' + c.downlink + ' Мбит/с');
  if (c.rtt) parts.push('пинг ~' + c.rtt + ' мс');
  return parts.join(', ') || null;
}

const darkReader = () => wait(900).then(() =>
  document.querySelector('meta[name="darkreader"], style.darkreader') || document.documentElement.hasAttribute('data-darkreader-scheme')
    ? 'Dark Reader' : null);

// ---------- стикеры по порядку ----------
// big: широкая плашка с розовой кромкой, small: мелочь
const plan = [
  async () => { const d = await device(); return d && { k: 'устройство', v: d.v, s: d.s, size: 'big' }; },
  // Подмены: сначала показываем, что сказал браузер, потом зачёркиваем.
  async () => BRAVE && rawGpu && { k: 'видеокарта', v: rawGpu, lie: { stamp: 'ПОДДЕЛКА', truth: 'настоящую он спрятал' } },
  async () => { const b = await rawBattery; if (!b) return null;
    const v = Math.round(b.level * 100) + '%' + (b.charging ? ', на зарядке' : '');
    return BRAVE ? { k: 'заряд', v, lie: { stamp: 'ПОДДЕЛКА', truth: 'настоящий он спрятал' } } : { k: 'заряд', v, size: 'big' }; },
  async () => { const c = chip(); const rep = navigator.hardwareConcurrency; const m = await measured;
    if (m && rep && m > rep) return { k: 'процессор', v: rep + ' ' + plural(rep, 'ядро', 'ядра', 'ядер'), lie: { stamp: 'ВРАНЬЁ', truth: 'на деле минимум ' + m } };
    const n = !BRAVE && rep;
    return (c || n) && { k: c ? 'процессор, скорее всего' : 'процессор', v: c || n + ' ' + plural(n, 'поток', 'потока', 'потоков'),
      s: c && n ? n + ' ' + plural(n, 'поток', 'потока', 'потоков') : null, size: c ? 'big' : '' }; },
  async () => (BRAVE || NOISE) && { k: 'защита', v: 'Твой браузер пытался меня обмануть', s: 'Не вышло: IP, время и экран он не спрятал', size: 'big' },
  async () => ({ k: 'время', v: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + (tzName ? ' по ' + tzName : '') }),
  async () => gpuName && { k: 'видеокарта', v: gpuName },
  async () => { const b = await browser(); return b && { k: 'браузер', v: b }; },
  // Мелочь одной бегущей строкой.
  async () => {
    const d = window.devicePixelRatio || 1;
    const parts = [`экран ${Math.round(screen.width * d)}×${Math.round(screen.height * d)}`];
    if (matchMedia('(prefers-color-scheme: dark)').matches) parts.push('тёмная тема');
    const n = netLine(); if (n) parts.push(n);
    parts.push(languages());
    if (!BRAVE && navigator.deviceMemory) parts.push('память ' + (navigator.deviceMemory >= 8 ? '8+' : navigator.deviceMemory) + ' ГБ');
    if (await darkReader()) parts.push('включён Dark Reader');
    return { ticker: parts.join('  ·  ') };
  },
];

function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}

// Финал: самый сильный факт.
async function verdict() {
  const ip = await ipInfo, real = await rtcIP;
  if (ip && real && real !== ip.ip) return { tape: 'ТВОЙ НАСТОЯЩИЙ IP', text: real, small: 'VPN показывает ' + ip.ip + ', а телефон сам сдал настоящий' };
  if (ip?.timezone?.id && !TZ_HIDDEN && ip.timezone.id !== tz)
    return { tape: 'ТЫ ЧЕРЕЗ VPN', text: `По IP это ${ip.country}, а часы у тебя идут по ${tzName}`, small: 'VPN спрятал адрес, но не время' };
  if (/Telegram/i.test(ua) || window.TelegramWebviewProxy) return { tape: 'ИЗ ТЕЛЕГРАМА', text: 'Ты открыл это прямо из чата', small: 'Встроенный браузер Телеграма себя выдаёт' };
  return { tape: 'Я ТЕБЯ ВИЖУ', text: ip?.city ? 'Твой IP ведёт в город ' + ip.city : 'И это была одна секунда', small: 'А ты ничего не разрешал' };
}

// ---------- показ ----------
const flash = $('flash');
const GLYPHS = '█▓▒░#@$%&*+=?/\\|<>01';

function scramble(el, text, ms) {
  const t0 = performance.now();
  return new Promise(res => {
    (function tick(now) {
      const p = Math.min(1, (now - t0) / ms);
      const n = Math.floor(text.length * p);
      el.textContent = text.slice(0, n) + Array.from(text.slice(n), c => c === ' ' ? ' ' : GLYPHS[Math.random() * GLYPHS.length | 0]).join('');
      p < 1 ? requestAnimationFrame(tick) : res();
    })(t0);
  });
}

// Трясём не body: transform на body ломает position: fixed у финала.
function hit(w, red) {
  const box = $('final').classList.contains('in') ? $('final') : $('page');
  box.classList.remove('shake1', 'shake2', 'shake3');
  void box.offsetWidth;
  box.classList.add('shake' + w);
  if (w >= 2) {
    flash.classList.toggle('red', !!red);
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  }
}

// IP подгоняется под ширину экрана.
function fitIP(text) {
  const el = $('ip');
  el.textContent = text;
  el.style.fontSize = Math.min(130, (document.documentElement.clientWidth * 0.94) / (text.length * 0.62)) + 'px';
  $('tape').style.fontSize = el.style.fontSize;
  $('where').style.top = `calc(50% + ${parseFloat(el.style.fontSize) * 0.75}px)`;
}

// Вспышки не чаще трёх в секунду (WCAG 2.3.1): удары идут не чаще раза в 450 мс.
async function run() {
  const results = plan.map(f => f().catch(() => null));
  const fin = verdict();

  const ip = await ipInfo;
  fitIP(ip?.ip || 'ПРИВЕТ');
  $('where').textContent = ip ? [ip.city, ip.country, ip.connection?.isp].filter(Boolean).join(', ') : '';
  $('hero').classList.add('in');
  await wait(230); hit(3);
  openGate();
  await wait(900);

  const board = $('board');
  let tilt = 2;
  for (const r of results) {
    const it = await r;
    if (it?.ticker) {
      const el = document.createElement('div');
      el.className = 'st ticker';
      el.style.setProperty('--r', '0deg');
      el.innerHTML = '<span></span>';
      el.firstChild.textContent = (it.ticker + '  ·  ').repeat(4);
      board.appendChild(el);
      requestAnimationFrame(() => el.classList.add('in'));
      hit(1);
      await wait(450);
      continue;
    }
    if (!it || !it.v) continue;
    const t = performance.now();
    if (it.lie) it.size = 'big';
    const el = document.createElement('div');
    el.className = 'st ' + (it.size || '');
    el.style.setProperty('--r', it.size === 'big' ? '0deg' : (tilt = -tilt) + 'deg');
    el.innerHTML = '<span class="k"></span><span class="v"></span><span class="s"></span>';
    el.querySelector('.k').textContent = it.k;
    if (it.s) el.querySelector('.s').textContent = it.s;
    board.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    hit(it.size === 'big' ? 2 : 1);
    await scramble(el.querySelector('.v'), String(it.v), it.size === 'big' ? 320 : 200);
    if (it.lie) {
      await wait(550);
      el.querySelector('.v').classList.add('struck');
      await wait(260);
      const st = document.createElement('span');
      st.className = 'stamp'; st.textContent = it.lie.stamp;
      el.appendChild(st);
      requestAnimationFrame(() => st.classList.add('in'));
      hit(2, true);
      await wait(200);
      const tr = el.querySelector('.s');
      tr.className = 't';
      await scramble(tr, it.lie.truth, 300);
      await wait(250);
    }
    await wait(Math.max(0, (it.size === 'big' ? 500 : 300) - (performance.now() - t)));
  }

  const f = await fin;
  await wait(700);
  for (const p of document.querySelectorAll('.police span')) p.textContent = (f.tape + ' ✕ ').repeat(12);
  $('verdict').innerHTML = '<span></span><small></small>';
  $('verdict').querySelector('span').textContent = f.text;
  $('verdict').querySelector('small').textContent = f.small;
  $('final').classList.add('in');
  await wait(120); hit(3, true);
  await wait(500); hit(2);

  // Через пару секунд ленты уезжают, вердикт ложится последней плашкой, данные снова видно.
  await wait(2400);
  $('final').classList.add('out');
  await wait(450);
  $('final').classList.remove('in');
  $('final').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'st big verdict';
  el.style.setProperty('--r', '0deg');
  el.innerHTML = '<span class="k"></span><span class="v"></span><span class="s"></span>';
  el.querySelector('.k').textContent = f.tape;
  el.querySelector('.v').textContent = f.text;
  el.querySelector('.s').textContent = f.small;
  $('board').appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  hit(2);
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  await wait(500);
  $('ask').classList.add('in');
  rec.askIn = performance.now();
  const r = $('ask').getBoundingClientRect();
  if (r.top < innerHeight && r.bottom > 0) rec.askSeen = rec.askIn;
}

// ---------- экран 2: повтор ----------
new IntersectionObserver(([e]) => {
  if (!rec.askIn || rec.done) return;
  if (e.isIntersecting) rec.askSeen ||= performance.now();
  else if (rec.askSeen) rec.leaves++;
}).observe($('ask'));

let askTouched = false;
$('ask').addEventListener('touchstart', () => { askTouched = true; }, { passive: true });
for (const ev of ['touchend', 'touchcancel']) {
  $('ask').addEventListener(ev, () => {
    setTimeout(() => { if (askTouched && !rec.done && rec.askIn) rec.almost++; askTouched = false; }, 500);
  }, { passive: true });
}
$('ask').addEventListener('click', () => {
  askTouched = false;
  if (rec.done || !rec.askIn) return;
  replay();
});

let locked = false;
addEventListener('wheel', e => { if (locked) e.preventDefault(); }, { passive: false });

const sec = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' с';

// Что было в центре экрана при такой прокрутке.
function spotAt(y, spots) {
  const probe = y + innerHeight * 0.45;
  let best = null, bd = Infinity;
  for (const sp of spots) {
    const d = probe < sp.top ? sp.top - probe : probe > sp.bottom ? probe - sp.bottom : 0;
    if (d < bd) { bd = d; best = sp; }
  }
  return best;
}

function median(a) { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; }

// Поза по наклону. Пороги сняты на OnePlus 16.11.2026.
function pose() {
  const n = performance.now();
  let src = rec.tilt.filter(t => n - t[0] < 4000);
  if (src.length < 3) src = rec.grav.filter(t => n - t[0] < 4000);
  if (src.length < 3) return null;
  const beta = median(src.map(t => t[1])), gamma = median(src.map(t => t[2]));
  if (Math.abs(gamma) > 50) return 'Ты лежишь на боку.';
  if (beta > 78) return 'Ты лежишь на спине.';
  if (beta >= 38) return 'Телефон у тебя перед лицом.';
  if (beta >= -10) return 'Телефон у тебя на коленях или на столе.';
  return null;
}

async function replay() {
  rec.done = true;
  const tEnd = performance.now(), yEnd = scrollY;
  const S = [...rec.scroll, [tEnd, yEnd]];

  // Остановки дольше 1,5 с, после того как страницу хоть раз двигали. Последняя (у кнопки) это колебание, её не считаем.
  const spots = [];
  const hr = $('hero').getBoundingClientRect();
  spots.push({ el: $('hero'), name: 'свой IP', top: hr.top + scrollY, bottom: hr.bottom + scrollY, left: innerWidth - 18 });
  for (const el of document.querySelectorAll('#board .st')) {
    const r = el.getBoundingClientRect();
    const kt = el.querySelector('.k')?.textContent;
    const k = kt ? kt[0] + kt.slice(1).toLowerCase().replace(/vpn|ip/g, m => m.toUpperCase()) : 'бегущую строку';
    spots.push({ el, name: k, top: r.top + scrollY, bottom: r.bottom + scrollY, left: r.right - 6 });
  }
  const stops = [];
  let moved = false;
  for (let i = 1; i < S.length - 1; i++) {
    if (Math.abs(S[i - 1][1] - S[0][1]) > 40) moved = true;
    const gap = S[i][0] - S[i - 1][0];
    if (gap >= 1500 && moved) stops.push({ t: S[i - 1][0], dur: gap, spot: spotAt(S[i - 1][1], spots) });
  }

  // Часы повтора: движение в 4 раза быстрее, долгие паузы сжаты до 0,9 с, всё вместе не дольше 9 с.
  const seg = [];
  let R = 0;
  for (let i = 1; i < S.length; i++) {
    const real = S[i][0] - S[i - 1][0];
    const len = Math.min(real / 4, 900);
    seg.push({ a: S[i - 1][0], b: S[i][0], ya: S[i - 1][1], yb: S[i][1], r: R, len });
    R += len;
  }
  const k = R > 9000 ? 9000 / R : 1;
  for (const g of seg) { g.r *= k; g.len *= k; }
  R *= k;

  // Удар: вспышка, всё серое, штамп ЗАПИСЬ.
  locked = true;
  hit(3);
  document.body.classList.add('rec');
  $('recov').classList.add('on', 'vhs');
  await wait(450);

  // Перемотка рывками наверх.
  const y0 = scrollY;
  await new Promise(res => {
    const st = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - st) / 700);
      scrollTo(0, y0 * (1 - p * p));
      $('page').style.transform = `translateX(${(Math.random() - .5) * 14}px)`;
      $('recov').querySelector('.tc').textContent = '-' + Math.round((1 - p) * (tEnd - rec.t0) / 1000) + ' с';
      p < 1 ? requestAnimationFrame(tick) : res();
    })(st);
  });
  $('page').style.transform = '';
  $('recov').classList.remove('vhs');
  hit(2);
  await wait(450);

  // Повтор.
  const trace = $('trace'), tc = $('recov').querySelector('.tc');
  let ti = 0, si = 0, gi = 0, lastHit = 0;
  const marks = new Map();
  await new Promise(res => {
    const st = performance.now();
    (function tick(now) {
      const r = Math.min(R, now - st);
      while (gi < seg.length - 1 && seg[gi].r + seg[gi].len < r) gi++;
      const g = seg[gi];
      const p = g.len ? Math.min(1, (r - g.r) / g.len) : 1;
      const real = g.a + (g.b - g.a) * p;
      scrollTo(0, g.ya + (g.yb - g.ya) * p);
      const s = Math.floor((real - rec.t0) / 1000);
      tc.textContent = String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      while (ti < rec.touch.length && rec.touch[ti][0] <= real) {
        const d = document.createElement('div');
        d.className = 'dot';
        d.style.left = rec.touch[ti][1] + 'px';
        d.style.top = rec.touch[ti][2] + 'px';
        trace.appendChild(d);
        setTimeout(() => d.remove(), 950);
        ti++;
      }
      while (si < stops.length && stops[si].t + stops[si].dur <= real) {
        const sp = stops[si].spot;
        let m = marks.get(sp);
        if (!m) {
          m = document.createElement('div');
          m.className = 'mark';
          m.style.left = sp.left + 'px';
          m.style.top = (sp.top - 12) + 'px';
          m.textContent = sec(stops[si].dur);
          trace.appendChild(m);
          marks.set(sp, m);
        } else {
          m.textContent += ', потом ' + sec(stops[si].dur);
          m.classList.remove('in'); void m.offsetWidth;
        }
        m.classList.add('in');
        if (now - lastHit > 450) { hit(1); lastHit = now; }
        si++;
      }
      r < R ? requestAnimationFrame(tick) : res();
    })(st);
  });
  scrollTo(0, yEnd);
  await wait(450);

  // Колебание на кнопке.
  const ask = $('ask');
  const h = Math.max(0, tEnd - (rec.askSeen || rec.askIn));
  ask.classList.add('counting');
  hit(3, true);
  await new Promise(res => {
    const st = performance.now();
    (function tick(now) {
      const p = Math.min(1, (now - st) / 800);
      ask.textContent = 'Ты думал ' + sec(h * p);
      p < 1 ? requestAnimationFrame(tick) : res();
    })(st);
  });
  $('recov').classList.remove('on');
  locked = false;
  await wait(500);

  const lines = [];
  if (h < 1500) lines.push('Ты нажал почти сразу. Даже не раздумывал.');
  else if (h < 8000) lines.push('Столько ты решал, нажимать или нет.');
  else lines.push('Столько ты сомневался, прежде чем нажать.');
  if (rec.almost) lines.push(rec.almost === 1 ? 'Один раз палец уже лежал на кнопке, и ты его убрал.' : `${rec.almost} ${plural(rec.almost, 'раз', 'раза', 'раз')} палец уже лежал на кнопке, и ты его убирал.`);
  if (rec.leaves) lines.push(rec.leaves === 1 ? 'Ты уходил от кнопки и вернулся.' : `Ты уходил от кнопки ${rec.leaves} ${plural(rec.leaves, 'раз', 'раза', 'раз')} и всё равно вернулся.`);
  const top = stops.reduce((a, b) => (b.dur > (a?.dur || 0) ? b : a), null);
  if (top && top.dur >= 2000) lines.push(`Дольше всего ты смотрел на «${top.spot.name}»: ${sec(top.dur)}.`);
  const ps = pose();
  if (ps) lines.push('И ещё. ' + ps);
  lines.push({ small: 'Любая страница видит, где ты остановился, куда ткнул' + (ps ? ', как держишь телефон' : '') + ' и сколько думал. Разрешения для этого не нужно.' });

  const after = $('after');
  for (const l of lines) {
    const el = document.createElement('p');
    if (typeof l === 'object') { el.className = 'small'; el.textContent = l.small; } else el.textContent = l;
    after.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const sm = typeof l === 'object';
    hit(sm ? 1 : 2);
    await wait(sm ? 600 : 900);
  }
}
run();
</script>
