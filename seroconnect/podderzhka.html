<!-- ══════════════════════════════════════════════════════════════════
     ПОДДЕРЖКА. Макет 07.10.2026, обе страницы в одном файле.

     Слева «Что случилось?»: строки-ответы. Открытая строка и есть тема
     письма, поля темы нет. Справа разговор: форма нового обращения или
     открытое обращение (оно у человека может быть только одно).

     Без входа: 4 строки + «Другое» (там код на почту и нет доступа к
     почте), форма почта + текст. Со входом: порядок строк по состоянию
     подписки, внутри его данные, форма без почты, со скриншотом.
     С оплаты (?pay): открыта «Оплатил, а доступа нет», плашка платежа.
     После отправки срок ответа НЕ обещаем, он всегда разный.

     Набор строк из разбора 47 живых обращений (дамп 07.10.2026):
     не работает 20, оплатил без доступа 16, куда ссылку 11, до покупки 0.

     Адрес: ?in вошёл, ?s=none|pending|active, ?t обращение, ?pay с оплаты.
     Клавиши: L S T P.
     ══════════════════════════════════════════════════════════════════ -->

/* ── ШАПКА ──────────────────────────────────────────────────────────
   Снята с первого экрана правилами как есть (обоснования там). Без
   неё колонка висела в пустоте и страница не читалась частью сайта. */
.brand .wm{font-family:var(--sans)}

.brand{display:flex; align-items:center; gap:11px; text-decoration:none}
.brand svg{display:block; height:26px; width:auto}

.headcta{position:relative; display:inline-flex; align-items:center; height:38px; padding:0 17px; border-radius:8px; font-family:var(--mono); font-size:11.5px; font-weight:500; color:#ffffff; text-decoration:none; white-space:nowrap; word-spacing:-.3em; background:linear-gradient(#ffffff0a 0%, #ffffff00 100%); border:0; box-shadow: 0 3px 0 #00000080, 0 8px 14px -6px #00000099; transition:color .14s, transform .24s cubic-bezier(.4,0,.2,1), box-shadow .24s cubic-bezier(.4,0,.2,1);}

/* ── СТРАНИЦА ───────────────────────────────────────────────────────
   Слева всегда «Что случилось?»: строки-ответы. Справа «разговор с
   нами»: либо форма нового обращения, либо открытое обращение. Новое
   при открытом бэкенд не создаст, поэтому место одно на двоих. */
main{flex:1;display:block;padding:132px 20px 96px}
.col{display:flex;flex-direction:column;gap:40px;width:100%}
.ask{display:flex;flex-direction:column}
h1{font-family:var(--sans);font-weight:600;font-size:44px;line-height:1;
  letter-spacing:-.02em;color:#f5f5f5;margin-bottom:28px}
.lead{font-size:12px;letter-spacing:.06em;color:#6f676b;margin:-16px 0 24px;line-height:1.7}

/* Строка: голое слово с линией снизу, как поля на оплате. Отметка
   справа плюсом, раскрытая минусом. */
.q{border-bottom:1px solid #2a2427}
.q:first-of-type{border-top:1px solid #2a2427}
.qh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;
  background:none;border:0;font-family:inherit;font-size:16px;letter-spacing:.01em;
  color:#a2a2a2;cursor:pointer;padding:18px 0;text-align:left;
  transition:color .15s cubic-bezier(.4,0,.2,1)}
.qh:hover{color:#a3869f}
.qh .pm{flex:none;width:12px;text-align:center;color:#4d4549;transition:color .15s}
.q.open .qh{color:#f5f5f5}
.q.open .qh .pm{color:#c47bbe}
.qh .tag{font-size:10px;letter-spacing:.12em;color:#c47bbe;margin-left:12px;text-transform:uppercase}

.fold{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .32s cubic-bezier(.23,1,.32,1)}
.fold>div{overflow:hidden;min-height:0}
.fold.open{grid-template-rows:1fr}
@media (max-width:760px){
  .fold.open{transition:grid-template-rows .6s cubic-bezier(.2,.6,.2,1)}
}
@media (prefers-reduced-motion:reduce){ .fold{transition:none!important} }

.ans{padding:0 0 22px;font-size:13px;line-height:1.75;letter-spacing:.01em;color:#8a8286}
.ans ol{list-style:none;counter-reset:ш;display:flex;flex-direction:column;gap:8px}
.ans ol li{counter-increment:ш;display:grid;grid-template-columns:28px 1fr}
.ans ol li::before{content:counter(ш,decimal-leading-zero);color:#4d4549;font-size:11px;padding-top:2px}
.ans p+p,.ans p+ol,.ans ol+p{margin-top:10px}
.ans a{color:#a3869f;text-decoration:none;border-bottom:1px solid #4d4549}
.ans a:hover{color:#d68fd0}
.ans b{font-weight:500;color:#cdc6ca}
.fact{font-size:12px;letter-spacing:.04em;color:#a3869f;margin-bottom:10px}
.sub{margin-top:14px}
.sub h3{font-size:13px;font-weight:400;color:#cdc6ca;margin-bottom:2px}
.more{margin-top:14px}

.txt{background:none;border:0;font-family:inherit;font-size:12px;letter-spacing:.04em;
  color:#8a8286;cursor:pointer;padding:6px 0;text-align:left;
  transition:color .15s cubic-bezier(.4,0,.2,1)}
.txt:hover{color:#a3869f}
.txt u{text-decoration:none;border-bottom:1px solid #3a3236;padding-bottom:1px}
.txt.acc{color:#c47bbe}
.txt.acc:hover{color:#d68fd0}

/* ── ФОРМА И ОБРАЩЕНИЕ ───────────────────────────────────────────── */
.talk{display:flex;flex-direction:column;gap:22px}
.topic{font-size:11px;letter-spacing:.08em;color:#6f676b}
.topic b{font-weight:400;color:#cdc6ca}
.flbl{display:block;font-size:11px;letter-spacing:.08em;color:#6f676b;margin-bottom:2px}
.field{width:100%;background:none;border:0;border-bottom:1px solid #3a3236;
  font-family:inherit;font-size:15px;color:#f5f5f5;padding:10px 0;outline:none;
  border-radius:0;resize:none;line-height:1.6;
  transition:border-color .15s cubic-bezier(.4,0,.2,1)}
.field::placeholder{color:#4d4549}
.field:hover{border-bottom-color:#4d4549}
.field:focus{border-bottom-color:#c47bbe}
.field.bad{border-bottom-color:#b8606f}
textarea.field{min-height:92px;font-size:14px}
.note{font-size:11px;letter-spacing:.04em;line-height:1.6;color:#6f676b;margin-top:8px}
.note.bad{color:#c98a95}
.note:empty{display:none}
.acts{display:flex;align-items:center;justify-content:space-between;gap:16px}
.file{font-size:11px;color:#a3869f;letter-spacing:.04em}

/* Плашка платежа: человек пришёл со страницы оплаты, номер уйдёт
   вместе с обращением. Линия слева, без заливки. */
.payref{border-left:1px solid #c47bbe;padding:2px 0 2px 14px;font-size:11px;
  line-height:1.8;letter-spacing:.04em;color:#8a8286}
.payref b{font-weight:400;color:#cdc6ca}

/* Кнопка отправки: та же объёмная, что «Личный кабинет» в шапке. */
.send{position:relative;display:inline-flex;align-items:center;height:38px;padding:0 20px;
  border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;
  cursor:pointer;border:0;background:linear-gradient(#ffffff0a 0%,#ffffff00 100%);
  box-shadow:0 3px 0 #00000080,0 8px 14px -6px #00000099,inset 0 0 0 #00000000;
  transition:color .14s,transform .24s cubic-bezier(.4,0,.2,1),box-shadow .24s cubic-bezier(.4,0,.2,1)}
.send:hover{color:#c47bbe}
.send.is-down{transform:translateY(3px);box-shadow:0 0 0 #00000000,0 2px 4px -3px #00000066,inset 0 2px 3px #00000080;
  transition:color .14s,transform 180ms cubic-bezier(.4,0,.2,1),box-shadow 180ms cubic-bezier(.4,0,.2,1)}
.send.busy{animation:дышать 1.4s ease-in-out infinite;cursor:progress}
@keyframes дышать{50%{opacity:.5}}

.done h2{font-family:var(--sans);font-weight:600;font-size:28px;color:#f5f5f5;letter-spacing:-.01em}
.done p{font-size:13px;line-height:1.7;color:#8a8286;margin-top:8px}
.done p b{font-weight:400;color:#cdc6ca}

/* Переписка. Пузырей нет (залитых блоков на сайте нет ни одного):
   подпись над текстом, поддержка помечена цветом. */
.th-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.th-head h2{font-family:var(--sans);font-weight:600;font-size:22px;color:#f5f5f5;letter-spacing:-.01em}
.turn{font-size:11px;letter-spacing:.08em;color:#a3869f;white-space:nowrap}
.turn.them{color:#6f676b}
.msgs{display:flex;flex-direction:column;gap:20px}
.msg .who{font-size:11px;letter-spacing:.08em;color:#6f676b;margin-bottom:4px}
.msg.sup .who{color:#c47bbe}
.msg .tx{font-size:13.5px;line-height:1.7;color:#cdc6ca}
.msg .at{font-size:11px;color:#a3869f;margin-top:4px}
.msg.sup{padding-left:14px;border-left:1px solid #3a3236}
.close{align-self:flex-start}

.past .ans{padding-bottom:14px}
.past li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;font-size:12px;color:#8a8286}
.past li span:last-child{color:#4d4549}
.past ul{list-style:none;display:flex;flex-direction:column;gap:8px}

.hint{position:fixed;left:20px;right:20px;bottom:14px;font-size:10px;
  letter-spacing:.08em;line-height:1.7;color:#4d4549;pointer-events:none}

@media (max-width:760px){
  main{padding:96px 20px 80px}
  .sitehead{height:56px; padding-left:16px; padding-right:16px}

  .brand .wm{font-size:16.5px}
  .headcta{height:33px; padding:0 14px; font-size:12.5px}
  h1{font-size:34px;margin-bottom:22px}
  .qh{font-size:15px;padding:16px 0}
}

/* ── СЕТКА ───────────────────────────────────────────────────────────
   Колонки сайта (grid.css). Строки-ответы 1–6 от кромки логотипа,
   разговор 8–12, прибит к верху списка и едет за ним при прокрутке.
   На узком одна колонка: открытое обращение над списком (оно главное),

@media (min-width:960px){
  main{padding:132px 0 96px}
  .col{display:grid;grid-template-columns:repeat(var(--колонок),minmax(0,1fr));
    column-gap:var(--жёлоб);padding:0 var(--поле-п) 0 var(--поле-л);align-items:start}
  .ask{grid-column:1/7;grid-row:1}
  .talk{grid-column:8/13;grid-row:1;position:sticky;top:96px;padding-top:72px}
}
@media (max-width:959px){
  .talk.thread{order:-1}
  .q .talk{padding:26px 0 26px}
}

<main>
<div class="col" id="col">
  <section class="ask">
    <h1>Что случилось?</h1>

<p class="hint">L вошёл / нет · S состояние подписки · T открытое обращение · P пришёл с оплаты</p>
<script>
const $ = s => document.querySelector(s);
const адрес = new URLSearchParams(location.search);
if (адрес.get('v') === 'preview') $('.hint').remove();

/* ── СОСТОЯНИЕ МАКЕТА ─────────────────────────────────────────────── */
let вошёл = адрес.has('in') || адрес.has('вошёл');
let сост = ['none','pending','active'].includes(адрес.get('s')) ? адрес.get('s') : 'active';
let тикет = адрес.has('t');
let сОплаты = адрес.has('pay');
let отправлено = false;
let открыта = сОплаты ? 'paid' : null;
let прошлых = 2;
let почтаОтвета = '';
let переписка = [
  {sup:false, when:'вы · 06.10, 21:14', tx:'Не подключается ни один сервер, пишет тайм-аут. Вчера всё работало.'},
  {sup:true,  when:'поддержка · 07.10, 10:02', tx:'Мы вчера сменили адреса серверов. Обновите подписку в приложении: кнопка обновления рядом с профилем. Помогло?'},
];
let ход = 'вы';               // чей ход: 'вы' или 'мы'

const ПОЧТА = 'mail@example.ru';
const ИМЯ_СОСТ = {none:'подписка кончилась', pending:'доступ готовится', active:'подписка активна'};

/* ── ОТВЕТЫ ──────────────────────────────────────────────────────────
   Порядок у вошедшего зависит от состояния: первым то, с чем он
   скорее всего пришёл. Внутри его настоящие данные вместо общих
   советов (здесь имитация). */
const ОТВЕТЫ = {
  renew: {t:'Продлить подписку', b:() => `
    <p class="fact">подписка кончилась 02.10</p>
    <p>После оплаты обновите подписку в приложении. Серверы вернутся в список сами, заново добавлять ссылку не нужно.</p>
    <p class="more"><a href="oplata.html">продлить</a></p>`},
  work: {t:'Не работает', b:() => `
    ${вошёл ? (сост === 'active'
      ? '<p class="fact">подписка активна до 07.11, дело не в оплате</p>'
      : сост === 'none' ? '<p class="fact">подписка кончилась 02.10, поэтому и не работает</p>' : '') : ''}
    <ol>
      <li><span>Обновите подписку в приложении: кнопка обновления рядом с профилем. Серверы иногда меняются.</span></li>
      <li><span>Выберите другой сервер из списка.</span></li>
      ${вошёл ? '' : '<li><span>Проверьте в <a href="#">кабинете</a>, не кончился ли срок.</span></li>'}
    </ol>`},
  paid: {t:'Оплатил, а доступа нет', b:() => вошёл ? (
    сост === 'pending' ? `
      <p class="fact">платёж 199 ₽ от 07.10 прошёл</p>
      <p>Доступ готовится. <a href="#">Кабинет</a> покажет ссылку сам, обновлять страницу не нужно. Обычно это несколько секунд.</p>`
    : сост === 'active' ? `
      <p class="fact">последний платёж 199 ₽ от 07.10 прошёл, доступ до 07.11</p>
      <p>Ссылка лежит в <a href="#">кабинете</a>. Если в приложении серверов нет, обновите в нём подписку.</p>`
    : `
      <p class="fact">последний платёж 199 ₽ от 02.09, подписка кончилась 02.10</p>
      <p>Платежей после него мы не видим. Если вы платили с другой почты, напишите нам, укажите дату и сумму.</p>`
  ) : `
    <ol>
      <li><span>Войдите в <a href="#">кабинет</a> с той почтой, которую указали при оплате.</span></li>
      <li><span>Ссылка появится там сама, обычно за несколько секунд.</span></li>
    </ol>
    <p>Если кабинет пишет, что подписки нет, напишите нам. Найдём платёж.</p>`},
  link: {t:'Куда вставлять ссылку', b:() => `
    <p>Ссылка лежит в ${вошёл ? '<a href="#">кабинете</a>' : 'кабинете'}. Её вставляют в VPN-приложение, а какое приложение и куда нажать, написано в <a href="#">инструкции для вашего устройства</a>.</p>`},
  refund: {t:'Вернуть деньги', b:() => `
    <p>В течение трёх дней с оплаты, причину объяснять не нужно. Позже тоже можно, если техническую проблему не удалось решить.</p>
    <p>Напишите нам${вошёл ? '' : ' с почты аккаунта'}. Подробнее в <a href="#">условиях оплаты</a>.</p>`},
  other: {t:'Другое', b:() => вошёл ? `
    <p>Опишите, что случилось. Скриншот из приложения сильно ускоряет разбор.</p>` : `
    <div class="sub"><h3>Не приходит код на почту</h3>
      <p>Подождите минуту и загляните в «Спам». Если в адресе опечатка, введите его заново.</p></div>
    <div class="sub"><h3>Нет доступа к почте</h3>
      <p>Напишите с новой почты и укажите дату и сумму платежа. По ним найдём аккаунт.</p></div>`},
};
const порядок = () => !вошёл ? ['work','paid','link','refund','other']
  : сост === 'none'    ? ['renew','work','paid','link','refund','other']
  : сост === 'pending' ? ['paid','work','link','refund','other']
  :                      ['work','paid','link','refund','other'];

const узкий = () => matchMedia('(max-width:959px)').matches;

function рисоватьСписок(){
  $('#col').appendChild($('#talk'));   // форма могла сидеть внутри строки
  const html = порядок().map(k => {
    const о = ОТВЕТЫ[k];
    const пишем = k === 'renew' ? '' : k === 'other' ? '' :
      `<p class="more"><button class="txt acc" data-write type="button"><u>${тикет && вошёл
        ? 'дописать в текущее обращение' : 'не помогло, написать нам'}</u></button></p>`;
    return `<div class="q${открыта === k ? ' open' : ''}" data-k="${k}">
      <button class="qh" type="button" aria-expanded="${открыта === k}">
        <span>${о.t}</span><span class="pm">${открыта === k ? '−' : '+'}</span></button>
      <div class="fold${открыта === k ? ' open' : ''}"><div><div class="ans">${о.b()}${пишем}</div></div></div>
    </div>`;
  }).join('');
  const past = вошёл ? `<div class="q past" data-k="past" style="margin-top:28px">
      <button class="qh" type="button"><span style="font-size:13px;color:#6f676b">прошлые обращения (${прошлых})</span><span class="pm">+</span></button>
      <div class="fold"><div><div class="ans"><ul>
        ${прошлых > 2 ? '<li><span>07.10</span><span>Не работает</span><span>решён</span></li>' : ''}
        <li><span>14.09</span><span>Куда вставлять ссылку</span><span>решён</span></li>
        <li><span>02.08</span><span>Оплатил, а доступа нет</span><span>решён</span></li>
      </ul></div></div></div></div>` : '';
  $('#list').innerHTML = html + past;
}

function тема(){ return открыта && !['other','renew'].includes(открыта) && ОТВЕТЫ[открыта] ? ОТВЕТЫ[открыта].t.toLowerCase() : 'другое'; }

function рисоватьРазговор(){
  const t = $('#talk');
  t.classList.toggle('thread', вошёл && тикет);
  if (вошёл && тикет){
    t.innerHTML = `
      <div class="th-head"><h2>Ваше обращение</h2>
        <span class="turn${ход === 'мы' ? ' them' : ''}">${ход === 'вы' ? 'ждём вас' : 'ждём ответа поддержки'}</span></div>
      <div class="msgs">${переписка.map(м => `<div class="msg${м.sup ? ' sup' : ''}">
        <p class="who">${м.when}</p><p class="tx">${м.tx}</p>${м.at ? `<p class="at">${м.at}</p>` : ''}</div>`).join('')}</div>
      <div><textarea class="field" id="msg" rows="3" placeholder="ответить"></textarea><p class="note" id="msgnote"></p></div>
      <div class="acts"><button class="txt" id="attach" type="button"><u>прикрепить скриншот</u></button><button class="send" id="send" type="button">отправить</button></div>
      <p class="file" id="file"></p>
      <button class="txt close" id="close" type="button"><u>вопрос решён, закрыть</u></button>`;
  } else if (отправлено){
    t.innerHTML = `<div class="done"><h2>Получили.</h2>
      <p>Ответ придёт на почту <b>${почтаОтвета}</b>.</p></div>
      <button class="txt" id="again" type="button" style="align-self:flex-start"><u>написать ещё</u></button>`;
  } else {
    t.innerHTML = `
      <p class="topic">тема: <b id="topic">${тема()}</b></p>
      ${сОплаты ? `<div class="payref">платёж <b>2c1f…a08e</b> · 199 ₽ · 07.10, 15:12<br>приложим к обращению</div>` : ''}
      ${вошёл ? '' : `<div><label class="flbl" for="email">почта для ответа</label>
        <input class="field" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" spellcheck="false">
        <p class="note" id="mailnote"></p></div>`}
      <div><label class="flbl" for="msg">что случилось</label>
        <textarea class="field" id="msg" rows="3" placeholder="коротко, своими словами"></textarea><p class="note" id="msgnote"></p></div>
      <div class="acts">${вошёл ? '<button class="txt" id="attach" type="button"><u>прикрепить скриншот</u></button>' : '<span></span>'}
        <button class="send" id="send" type="button">отправить</button></div>
      <p class="file" id="file"></p>`;
  }
  ставитьРазговор();
}

/* На узком форма нового обращения встаёт внутрь раскрытой строки,
   переписка остаётся наверху. На широком всё на своих местах. */
function ставитьРазговор(){
  const t = $('#talk');
  const вСтроку = узкий() && !(вошёл && тикет) && открыта && открыта !== 'renew';
  const куда = вСтроку ? document.querySelector(`.q[data-k="${открыта}"] .ans`) : $('#col');
  if (t.parentNode !== куда) куда.appendChild(t);
}

function всё(){ рисоватьСписок(); рисоватьРазговор(); }

/* ── ДЕЙСТВИЯ ─────────────────────────────────────────────────────── */
$('#list').addEventListener('click', e => {
  const h = e.target.closest('.qh');
  if (h){
    const q = h.parentNode, k = q.dataset.k;
    const стала = !q.classList.contains('open');
    if (k !== 'past') document.querySelectorAll('.q.open:not(.past)').forEach(x => { if (x !== q){
      x.classList.remove('open'); x.querySelector('.fold').classList.remove('open');
      x.querySelector('.pm').textContent = '+'; x.querySelector('.qh').setAttribute('aria-expanded', false); }});
    q.classList.toggle('open', стала); q.querySelector('.fold').classList.toggle('open', стала);
    q.querySelector('.pm').textContent = стала ? '−' : '+';
    h.setAttribute('aria-expanded', стала);
    if (k !== 'past'){ открыта = стала ? k : null;
      const tp = $('#topic'); if (tp) tp.textContent = тема();
      ставитьРазговор(); }
    return;
  }
  if (e.target.closest('[data-write]')) писать();
});
function писать(){
  const m = $('#msg'); if (!m) return;
  if (!узкий()) m.focus({preventScroll:true});
  else { m.scrollIntoView({behavior:'smooth', block:'center'}); setTimeout(() => m.focus({preventScroll:true}), 350); }
}

$('#talk').addEventListener('click', e => {
  const id = e.target.closest('button')?.id;
  if (id === 'send') отправить();
  if (id === 'attach') $('#fileinp').click();
  if (id === 'again'){ отправлено = false; рисоватьРазговор(); }
  if (id === 'close'){ тикет = false; прошлых++; ход = 'вы'; всё(); }
});
$('#talk').addEventListener('input', e => {
  if (e.target.tagName === 'TEXTAREA'){ e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }
  e.target.classList.remove('bad');
  const n = e.target.parentNode.querySelector('.note'); if (n) n.textContent = '';
});
$('#fileinp').addEventListener('change', e => {
  const f = e.target.files[0]; $('#file').textContent = f ? 'приложен: ' + f.name : '';
});

function отправить(){
  const b = $('#send'); if (b.classList.contains('busy')) return;
  const m = $('#msg'), em = $('#email');
  let ок = true;
  if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value.trim())){
    em.classList.add('bad'); $('#mailnote').className = 'note bad';
    $('#mailnote').textContent = em.value.trim() ? 'похоже, в адресе опечатка' : 'нужна почта, на неё придёт ответ'; ок = false; }
  if (!m.value.trim()){ m.classList.add('bad'); $('#msgnote').className = 'note bad';
    $('#msgnote').textContent = 'напишите хоть пару слов'; ок = false; }
  if (!ок) return;
  b.classList.add('busy'); b.textContent = 'отправляем';
  const файл = $('#file').textContent.replace('приложен: ', '');
  setTimeout(() => {
    const сейчас = new Date(), чч = String(сейчас.getHours()).padStart(2,'0'), мм = String(сейчас.getMinutes()).padStart(2,'0');
    if (вошёл){
      переписка = тикет ? переписка : [];
      переписка.push({sup:false, when:`вы · 07.10, ${чч}:${мм}`, tx:m.value.trim().replace(/</g,'&lt;'), at: файл ? 'скриншот: ' + файл : ''});
      тикет = true; ход = 'мы'; $('#fileinp').value = '';
      всё();
    } else {
      почтаОтвета = em.value.trim().replace(/</g,'&lt;'); отправлено = true; рисоватьРазговор();
    }
  }, 900);
}

/* ── КЛАВИШИ МАКЕТА ───────────────────────────────────────────────── */
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'l' || k === 'д'){ вошёл = !вошёл; отправлено = false; }
  else if (k === 's' || k === 'ы'){ вошёл = true; сост = {none:'pending', pending:'active', active:'none'}[сост]; открыта = null; }
  else if (k === 't' || k === 'е'){ вошёл = true; тикет = !тикет; ход = 'вы'; }
  else if (k === 'p' || k === 'з'){ сОплаты = !сОплаты; открыта = сОплаты ? 'paid' : null; отправлено = false; }
  else return;
  всё(); статус();
});
function статус(){
  const h = $('.hint'); if (!h) return;
  h.textContent = (вошёл ? 'вошёл, ' + ИМЯ_СОСТ[сост] + (тикет ? ', есть обращение' : '') : 'не вошёл')
    + (сОплаты ? ', с оплаты' : '') + ' · L вход · S подписка · T обращение · P с оплаты';
}
/* Нажатие «отправить»: тот же пол в 180 мс, что у кнопки кабинета.
   Кнопка перерисовывается, поэтому слушаем на панели. */
{ let нач = 0, отл = 0, кн = null;
  const вниз = e => { const b = e.target.closest('.send'); if (!b) return;
    clearTimeout(отл); отл = 0; кн = b; нач = performance.now(); b.classList.add('is-down'); };
  const вверх = () => { if (!кн || отл) return; const b = кн;
    const ост = 180 - (performance.now() - нач);
    if (ост > 0) отл = setTimeout(() => { отл = 0; b.classList.remove('is-down'); }, ост);
    else b.classList.remove('is-down'); };
  $('#talk').addEventListener('pointerdown', вниз);
  addEventListener('pointerup', вверх); addEventListener('pointercancel', вверх); }
addEventListener('resize', ставитьРазговор);
всё(); статус();
</script>
<script>
/* Нажатие кнопки кабинета, с первого экрана. */
(() => {
  const btn = document.querySelector('.headcta');
  if (!btn) return;

  /* ПОЛ ПО ВРЕМЕНИ. Без него глубина нажатия зависела от того, как
     быстро убрали палец: замер семи нажатий дал 1,66 px при 30 мс
     (55 % хода), 2,51 при 50 (84 %) и полные 3,00 только с 70. Быстрый
     тап по телефону как раз укладывается в 50–100 мс, поэтому одно и
     то же действие каждый раз ощущалось по-разному — разброс в 45 %.
     Владелец поймал это рукой раньше, чем замер.

     110 мс = 70 на реальный ход до дна + 40 на то, чтобы дно было
     видно. Сорок — два-три кадра, меньше которых глаз не успевает
     зафиксировать положение; без них кнопка не нажимается, а звякает.

     Заодно записано: полный ход набирается к 70 мс, а НЕ к 90. Хвост
     кривой .4,0,.2,1 плоский, последние двадцать миллисекунд уже
     ничего не двигают. Та же природа, что у power3.out в барабане
     секции 4, где заявленные 0,46 с кончались к 180 мс.

     Пол висит на ВСЕХ способах снятия, включая отмену жеста
     прокруткой: отмена, обрезанная на двадцатой миллисекунде, дала бы
     ровно ту дёрганую мелочь, от которой уходим.

     Клик не задерживается ни на миллисекунду — пол живёт только на
     классе, переход по ссылке идёт своим чередом. */
  // 07.10.2026 нажатие замедлено до 180 мс: дно к ~140, плюс те же 40.
  const ПОЛ = 180;
  let начало = 0, отложено = 0;

  const down = () => {
    // повторный тык во время отсчёта отменяет отложенное снятие,
    // иначе частые тапы схлопнулись бы друг в друга
    clearTimeout(отложено); отложено = 0;
    начало = performance.now();
    btn.classList.add('is-down');
  };
  const up = () => {
    if (отложено) return;                      // отсчёт уже идёт
    const остаток = ПОЛ - (performance.now() - начало);
    if (остаток > 0){
      отложено = setTimeout(() => {
        отложено = 0;
        btn.classList.remove('is-down');
      }, остаток);
    } else {
      btn.classList.remove('is-down');
    }
  };

  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  // клавиатура: ссылка срабатывает по Enter, и отклик должен быть тот
  // же — иначе с клавиатуры кнопка выглядит неживой. Автоповтор при
  // удержании не мешает: down только продлевает вдавленность.
  btn.addEventListener('keydown', e => { if (e.key === 'Enter') down(); });
  btn.addEventListener('keyup',   e => { if (e.key === 'Enter') up();   });
  btn.addEventListener('blur', up);
})();
</script>
