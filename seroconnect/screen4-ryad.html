<!-- ══════════════════════════════════════════════════════════════════
     ФОРМА A, «ВИДОИСКАТЕЛЬ». Третий заход, 14 октября.
     Прежняя форма B («ряд и прибор», 20.08) лежит в истории git.

     Отзыв со стороны: порядок чтения шёл по размеру (199, «оформить»,
     199 «в месяц», мелкие сроки), число стояло дважды, сроки не
     выглядели нажимаемыми, кнопка читалась заголовком. Разбор, замеры
     и решения владельца в ~/dev/seroconnect-план-секций.md, раздел
     «СЕКЦИЯ 4, ЗАХОД ТРЕТИЙ».

     Устройство. Вопрос «на сколько подключить», под ним три срока.
     Выбранный отмечен ОДНОЙ сиреневой чертой, она переезжает со
     срока на срок тем же движением, что и выбор устройства на третьем
     экране. Уголки на секции значат только «нажми и купи», поэтому
     они есть лишь у кнопки. Цена одна, на кнопке, крутится барабанами.
     Под ней выгода (выходит 158 ₽ в месяц), на месяце строки нет.
     Надпись кнопки «> оформить на срок», слово срока стирается и
     набирается заново.

     Вступление один раз при появлении: месяц, 6 месяцев, год и обратно
     на 6 месяцев. Без движения (reduced motion) его нет.
     ══════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="grid.css">
<script src="grid.js" defer></script>
<style>
html{cursor:default}
@font-face{font-family:"Geist Mono Variable";font-style:normal;font-weight:100 900;
  font-display:swap;src:url(fonts/geist-mono-cyrillic-wght-normal.BZdD_g9V.woff2) format("woff2");
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Geist Mono Variable";font-style:normal;font-weight:100 900;
  font-display:swap;src:url(fonts/geist-mono-latin-wght-normal.Cjtb1TV-.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2212}
@font-face{font-family:"Space Grotesk Variable";font-style:normal;font-weight:300 700;
  font-display:swap;src:url(fonts/space-grotesk-latin-wght-normal.BhU9QXUp.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2212}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#161314;color:#a2a2a2;
  font-family:"Geist Mono Variable",ui-monospace,monospace;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased}
.col{display:flex;flex-direction:column;align-items:center;gap:28px;padding:16px}
.q{font-size:13px;letter-spacing:.06em;color:#8a8286;margin-bottom:-14px}

/* ── СРОКИ ──────────────────────────────────────────────────────────
   Пунктир и тусклые уголки под каждым сроком владелец отверг 14.10:
   уголки у сроков повторяли кнопку, и выбор выглядел второй кнопкой.
   Черта одна на весь ряд и стоит только под выбранным. */
.terms{position:relative;display:flex;gap:22px}
.t{position:relative;font:inherit;background:none;border:0;font-size:26px;padding:12px 16px;
  color:#6f676b;cursor:pointer;transition:color .4s cubic-bezier(.4,0,.2,1)}
.t span{padding-bottom:3px}
.t.on{color:#f5f5f5}
.t:not(.on):hover{color:#c9bfc5}
.t:focus-visible{outline:none}.t:focus-visible span{outline:1px dashed #c47bbe;outline-offset:6px}
/* Черта едет за выбором с тем же ходом, что и на третьем экране. */
.vf{position:absolute;top:0;left:0;height:100%;pointer-events:none;
  transition:transform .55s cubic-bezier(.65,0,.2,1),width .55s cubic-bezier(.65,0,.2,1)}
.vf::after{content:"";position:absolute;left:var(--px,16px);right:var(--px,16px);bottom:4px;height:2px;background:#c47bbe}

/* ── КНОПКА ─────────────────────────────────────────────────────────
   Уголки в покое 70 % орхидеи (3,6:1 к фону), при наведении сходятся. */
.buy{position:relative;background:none;border:0;font:inherit;color:inherit;cursor:pointer;
  padding:28px 56px 30px;display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:transform .12s cubic-bezier(.4,0,.2,1)}
.buy>i{position:absolute;width:16px;height:16px;border:0 solid #c47bbeb3;
  transition:transform .24s cubic-bezier(.23,1,.32,1),border-color .2s}
.buy:hover>i{border-color:#d68fd0}
.buy:hover>.tl{transform:translate(5px,5px)}.buy:hover>.tr{transform:translate(-5px,5px)}
.buy:hover>.bl{transform:translate(5px,-5px)}.buy:hover>.br{transform:translate(-5px,-5px)}
.buy:active{transform:translateY(2px)}
.buy:focus-visible{outline:none}.buy:focus-visible>i{border-color:#efc6eb}
.buy:focus-visible .act{text-decoration:underline;text-underline-offset:6px}
.tl{top:0;left:0;border-top-width:1px!important;border-left-width:1px!important}
.tr{top:0;right:0;border-top-width:1px!important;border-right-width:1px!important}
.bl{bottom:0;left:0;border-bottom-width:1px!important;border-left-width:1px!important}
.br{bottom:0;right:0;border-bottom-width:1px!important;border-right-width:1px!important}

/* Рубль висит вне оси: число стоит по центру кнопки. */
.sumrow{position:relative;display:flex;align-items:baseline}
.sumrow .rub{position:absolute;left:calc(100% + 12px);bottom:.08em}
.num{display:inline-flex;font-family:"Space Grotesk Variable";font-weight:600;letter-spacing:-.03em;
  color:#f5f5f5;line-height:.92;font-size:132px;font-variant-numeric:tabular-nums;transition:color .12s}
.buy:hover .num{color:#efc6eb}
.rub{font-family:"Space Grotesk Variable";font-size:30px;color:#6f676b;font-weight:500}
/* Барабан с пустой первой клеткой: лишний разряд уезжает в пустоту
   и схлопывается по ширине. */
.slot{display:inline-block;overflow:hidden;height:.92em;transition:width .3s cubic-bezier(.23,1,.32,1)}
.slot.off{width:0!important;transition-delay:.25s}
.reel{display:flex;flex-direction:column;transition:transform .46s cubic-bezier(.2,.8,.2,1)}
.reel b{font-weight:inherit;height:.92em;line-height:.92}

.lab{font-size:16px;color:#8a8286;text-align:center;min-height:1.4em;
  transition:opacity .35s,transform .45s cubic-bezier(.2,0,0,1)}
.lab.fade{opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s}
.lab.come{opacity:0;transform:translateY(8px);transition:none}
.act{margin-top:10px;font-size:20px;letter-spacing:0;color:#d68fd0;white-space:pre}
.act .term{color:#f5f5f5}
.cur{display:inline-block;width:.55em;height:1em;background:#c47bbe;vertical-align:-2px;margin-left:6px;
  animation:bl 1.1s steps(1) infinite}
.cur.typing{animation:none}
@keyframes bl{50%{opacity:0}}
.after{font-size:11px;letter-spacing:.06em;margin-right:-.06em;color:#6f676b}

@media (max-width:600px){
  .terms{gap:10px}
  .t{font-size:21px;padding:11px 10px}.vf{--px:10px}
  .num{font-size:clamp(64px,23vw,96px)}.rub{font-size:32px}.sumrow .rub{left:calc(100% + 8px)}
  .buy{padding:22px 28px 24px}.lab{font-size:13px}.act{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .reel,.slot,.vf,.lab,.buy,.buy>i{transition:none!important}.cur{animation:none}
}
</style>

<div class="col">
  <p class="q">на сколько подключить</p>
  <div class="terms" role="radiogroup" aria-label="срок">
    <button class="t" role="radio"><span>1 месяц</span></button>
    <button class="t" role="radio"><span>6 месяцев</span></button>
    <button class="t" role="radio"><span>год</span></button>
    <div class="vf"></div>
  </div>
  <button class="buy">
    <span class="sumrow"><span class="num"></span><span class="rub" aria-hidden="true">₽</span></span>
    <span class="lab"></span>
    <span class="act"></span>
    <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
  </button>
  <p class="after">дальше оплата через ЮKassa</p>
</div>

<script>
/* Выгода СЧИТАЕТСЯ от суммы и срока, а не набирается руками. */
const T = [
  { sum: '199',  мес: 1,  слово: 'месяц' },
  { sum: '950',  мес: 6,  слово: '6 месяцев' },
  { sum: '1690', мес: 12, слово: 'год' },
].map(x => ({ ...x, ставка: Math.round(x.sum / x.мес) }));

const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const terms = document.querySelector('.terms');
const bs  = [...document.querySelectorAll('.t')];
const vf  = document.querySelector('.vf');
const buy = document.querySelector('.buy');
const NUM = document.querySelector('.num');
const LBL = document.querySelector('.lab');
const ACT = document.querySelector('.act');
let cur = 1;

function place(){
  const b = bs[cur];
  vf.style.width = b.offsetWidth + 'px';
  vf.style.transform = `translateX(${b.offsetLeft}px)`;
}

/* ── ЦЕНА: четыре барабана, первая клетка пустая ── */
NUM.innerHTML = [0, 1, 2, 3].map(() => '<span class="slot"><span class="reel">'
  + ' 0123456789'.split('').map(x => '<b>' + x + '</b>').join('') + '</span></span>').join('');
const SL = [...NUM.querySelectorAll('.slot')];
SL.forEach(x => x.style.width = '0.6em');
function roll(v, delay){
  const d = v.padStart(4, ' ');
  NUM.setAttribute('aria-label', v + ' ₽');
  SL.forEach((sl, i) => {
    const c = d[i];
    sl.classList.toggle('off', c === ' ');
    const r = sl.firstChild;
    r.style.transitionDelay = (delay + i * 45) + 'ms';
    r.style.transform = `translateY(${-(c === ' ' ? 0 : +c + 1) * 0.92}em)`;
  });
}

/* ── НАДПИСЬ: «> оформить на» сиренью, срок белым, срок перепечатывается ── */
ACT.innerHTML = '&gt; оформить на <span class="term"></span><span class="cur"></span>';
const TERM = ACT.querySelector('.term'), CUR = ACT.querySelector('.cur');
let typer = null;
function retype(word){
  clearInterval(typer);
  if (reduce() || !TERM.textContent){ TERM.textContent = word; return; }
  CUR.classList.add('typing');
  let phase = 0;
  typer = setInterval(() => {
    const t = TERM.textContent;
    if (phase === 0){ if (t.length && !word.startsWith(t)) TERM.textContent = t.slice(0, -1); else phase = 1; }
    else if (t.length < word.length) TERM.textContent = word.slice(0, t.length + 1);
    else { clearInterval(typer); CUR.classList.remove('typing'); }
  }, 32);
}

function draw(){
  const d = T[cur];
  roll(d.sum, 80);
  const tail = d.мес > 1 ? `выходит ${d.ставка} ₽ в месяц` : '';
  LBL.classList.add('fade');
  setTimeout(() => {
    LBL.classList.remove('fade'); LBL.classList.add('come');
    LBL.textContent = tail;
    void LBL.offsetWidth;
    LBL.classList.remove('come');
  }, 180);
  retype(d.слово);
}

function pick(i, hand){
  if (hand) stopIntro();
  cur = i;
  bs.forEach((x, j) => { x.classList.toggle('on', j === i); x.setAttribute('aria-checked', j === i); });
  place(); draw();
}
bs.forEach((b, i) => b.addEventListener('click', () => pick(i, true)));
terms.addEventListener('keydown', e => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!d) return;
  e.preventDefault();
  const i = (cur + d + 3) % 3;
  pick(i, true); bs[i].focus();
});

/* Переход на оплату с выбранным сроком (07.10.2026). Экран живёт в
   айфрейме склейки, поэтому уходит верхнее окно. Срок номером 1, 2, 3. */
buy.addEventListener('click', () => {
  const куда = 'oplata.html?t=' + (cur + 1);
  try { (window.top || window).location.href = куда; }
  catch { location.href = куда; }
});

/* ── ВСТУПЛЕНИЕ: один раз, когда кнопка видна ── */
let tm = [];
function stopIntro(){ tm.forEach(clearTimeout); tm = []; }
function intro(){
  stopIntro(); pick(0);
  [[900, 1], [1900, 2], [2900, 1]].forEach(([t, i]) => tm.push(setTimeout(() => pick(i), t)));
}
const io = new IntersectionObserver(e => {
  if (!e[0].isIntersecting) return;
  io.disconnect();
  if (!reduce()) setTimeout(intro, 400);
}, { threshold: .6 });
io.observe(buy);

/* Ширина кнопки заперта по самой длинной цене плюс место под рубль с
   обеих сторон: число не гуляет по оси при смене срока. На телефоне
   шире бывает надпись «оформить на 6 месяцев», тогда держит она. */
function lock(){
  buy.style.minWidth = '';
  SL.forEach(x => { x.classList.remove('off'); x.style.width = ''; });
  const dw = SL[1].firstChild.getBoundingClientRect().width;
  SL.forEach(x => x.style.width = dw + 'px');
  const w = buy.getBoundingClientRect().width;
  const n = NUM.getBoundingClientRect().width;
  const pad = parseFloat(getComputedStyle(buy).paddingLeft);
  roll(T[cur].sum, 0);
  const r = document.querySelector('.sumrow .rub').getBoundingClientRect().width + 12;
  buy.style.minWidth = Math.ceil(Math.max(w, n + 2 * r + 2 * pad)) + 'px';
}
/* Адресная строка телефона шлёт resize без смены ширины. */
let lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; lock(); place(); });
document.fonts.ready.then(() => { lock(); place(); });
pick(1);

addEventListener('keydown', e => { if (e.key === 'i' || e.key === 'ш') intro(); });
window.__set = i => pick(i, true);
</script>
