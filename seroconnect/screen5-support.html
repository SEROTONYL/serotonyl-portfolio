<!-- ЭКРАН 5 · ПОДДЕРЖКА. Набросок 04.10.2026.

     Отвечает на «а если сломается», но никуда не зовёт: секция стоит
     ПОСЛЕ кнопки покупки и обязана быть тише четвёртой, иначе уводит
     взгляд с неё (решение 20.08). Заголовок рифмуется с третьей
     секцией: там вопрос до покупки, здесь вопрос после.

     Сюда же переехала строка из старой третьей секции «не нашли своё
     устройство? напишите, ответит человек».

     ЧИСЛА — ЗАГЛУШКИ. 65 обращений сняты с прода 09.08.2026 и устарели,
     время ответа не замерялось вовсе. До выхода в прод пересчитать по
     базе: число обращений и медиану до первого ответа. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#110a0a;color:#8a8079;padding:40px 0;min-height:100vh;
  font-family:"Onest","Inter",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased}

.рама{width:100%;max-width:980px;padding:0 48px;display:flex;
  flex-direction:column;align-items:flex-start}

/* Тише третьей: тот же кегль вопроса, но темнее. */
h2{font-weight:400;font-size:56px;letter-spacing:-.025em;line-height:1.05;
  color:#6f645c}
.ответ{margin-top:16px;font-size:17px;line-height:1.4;color:#6f645c;max-width:560px}
.ответ b{font-weight:400;color:#a59a89}

/* Действие одно. Голая ссылка с метками реза, знак «сюда жмут». */
.написать{position:relative;margin-top:44px;padding:12px 16px;
  font-size:20px;color:#cdc3b8;text-decoration:none;letter-spacing:-.01em;
  transition:color .2s}
.написать:hover,.написать:focus-visible{color:#ece7dd;outline:0}
.написать i{position:absolute;width:9px;height:9px;border:solid #a8917a;
  transition:transform .3s cubic-bezier(.2,0,0,1)}
.написать i:nth-child(1){left:0;top:0;border-width:1px 0 0 1px}
.написать i:nth-child(2){right:0;top:0;border-width:1px 1px 0 0}
.написать i:nth-child(3){left:0;bottom:0;border-width:0 0 1px 1px}
.написать i:nth-child(4){right:0;bottom:0;border-width:0 1px 1px 0}
.написать:hover i:nth-child(1){transform:translate(-3px,-3px)}
.написать:hover i:nth-child(2){transform:translate(3px,-3px)}
.написать:hover i:nth-child(3){transform:translate(-3px,3px)}
.написать:hover i:nth-child(4){transform:translate(3px,3px)}

/* Факт моно: это показывает система, а не говорим мы. */
.факт{margin-top:40px;display:flex;flex-wrap:wrap;gap:8px 28px;
  font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;
  letter-spacing:.06em;color:#4f4741}
.факт span b{font-weight:400;color:#8a8073}
.где{margin-top:14px;font-family:"Geist Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.06em;color:#3a322e}

@media (max-width:720px){
  .рама{padding:0 24px}
  h2{font-size:36px}
  .ответ{font-size:15px}
  .написать{margin-top:32px;font-size:18px}
  .факт{margin-top:28px;flex-direction:column}
}
</style>

<div class="рама">
  <h2>А если сломается?</h2>
  <p class="ответ">Напишите. Не работает, не нашли своё устройство, что-то
    непонятно, <b>отвечает человек, а не бот</b>.</p>
  <a class="написать" href="#" onclick="return false"><i></i><i></i><i></i><i></i>написать в поддержку</a>
  <div class="факт">
    <span><b>65</b> обращений с марта</span>
    <span>ответ обычно за <b>~20 мин</b></span>
  </div>
  <p class="где">или из личного кабинета, раздел «поддержка»</p>
</div>
