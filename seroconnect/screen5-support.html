<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Экран 5 — поддержка</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ЭКРАН 5 · ПОДДЕРЖКА. Набросок 04.10.2026.

     Отвечает на «а если сломается», но никуда не зовёт: секция стоит
     ПОСЛЕ кнопки покупки и обязана быть тише четвёртой, иначе уводит
     взгляд с неё (решение 20.08). Заголовок рифмуется с третьей
     секцией: там вопрос до покупки, здесь вопрос после.

     Сюда же переехала строка из старой третьей секции «не нашли своё
     устройство? напишите, ответит человек».

     ЧИСЛА — ЗАГЛУШКИ. 65 обращений сняты с прода 09.08.2026 и устарели,
     время ответа не замерялось вовсе. До выхода в прод пересчитать по
     базе: число обращений и медиану до первого ответа. -->
<link rel="stylesheet" href="grid.css">
<script src="grid.js" defer></script>
<style>
/* 07.10.2026 по просьбе владельца: над обычным текстом курсор не
   превращается в текстовую палочку. Ссылки и кнопки держат свою руку. */
html{cursor:default}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
/* Верх прижат, а не по центру: заголовок обязан стоять у самой
   кромки, чтобы выглядывать из-под четвёртой (стык 4/5, вариант А). */
body{background:#161314;color:#8a8286;padding:48px 0 40px;min-height:100vh;
  font-family:"Onest","Inter",system-ui,sans-serif;
  display:flex;align-items:flex-start;justify-content:center;
  -webkit-font-smoothing:antialiased}

.рама{width:100%;padding:0 var(--поле-л);display:flex;
  flex-direction:column;align-items:center;text-align:center}
/* По центру, как четвёртая: 4 и 5 это кульминация и послесловие одной
   оси. Третья остаётся слева, она часть объяснения. */

/* Тише третьей: тот же кегль вопроса, но темнее. */
h2{font-weight:400;font-size:56px;letter-spacing:-.025em;line-height:1.05;
  color:#6f676b}
.ответ{margin-top:16px;font-size:17px;line-height:1.4;color:#6f676b;max-width:560px}
.ответ b{font-weight:400;color:#aea8ab}

/* Действие одно. Метки реза остались только у «оформить» в четвёртой,
   здесь строка ввода: начинаешь писать человеку. Моно рифмуется с
   фактами ниже. При наведении каретка перестаёт мигать и горит. */
.написать{margin-top:48px;padding:12px 4px;display:inline-flex;align-items:center;
  font-family:"Geist Mono",ui-monospace,monospace;font-size:17px;letter-spacing:.01em;
  color:#cdc6ca;text-decoration:none;transition:color .2s}
.написать .п{color:#a3869f;margin-right:.7em;transition:transform .3s cubic-bezier(.2,0,0,1)}
.написать .к{display:inline-block;width:.55em;height:1.15em;margin-left:.25em;
  background:#a3869f;animation:миг 1.1s steps(1) infinite}
.написать:hover,.написать:focus-visible{color:#ece8ea;outline:0}
.написать:hover .п,.написать:focus-visible .п{transform:translateX(3px)}
.написать:hover .к,.написать:focus-visible .к{animation:none;background:#d68fd0}
@keyframes миг{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.написать .к{animation:none}}

/* Факт моно: это показывает система, а не говорим мы. */
.факт{margin-top:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 32px;
  font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;
  letter-spacing:.06em;color:#4d4549}
.факт span b{font-weight:400;color:#8a8286}
.где{margin-top:16px;font-family:"Geist Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.06em;color:#3a3336}

@media (max-width:760px){
  h2{font-size:36px}
  .ответ{font-size:15px}
  .написать{margin-top:32px;font-size:15px}
  .факт{margin-top:24px;flex-direction:column;align-items:center}
  body{padding-top:40px}
}
</style>

<div class="рама">
  <h2>А если сломается?</h2>
  <p class="ответ">Напишите. Не работает, не нашли своё устройство, что-то
    непонятно, <b>отвечает человек, а не бот</b>.</p>
  <a class="написать" href="#" onclick="return false"><span class="п" aria-hidden="true">&gt;</span>написать в поддержку<span class="к" aria-hidden="true"></span></a>
  <div class="факт">
    <span><b>65</b> обращений с марта</span>
    <span>ответ обычно за <b>~20 мин</b></span>
  </div>
  <p class="где">или из личного кабинета, раздел «поддержка»</p>
</div>
