<!-- ══════════════════════════════════════════════════════════════════
     ЭКРАН 3 · УСТРОЙСТВА. Набросок 17 сентября.

     Содержание назначено 19 августа (раскладка «вариант 1»): «на моём
     заработает?» это возражение ДО оплаты, поэтому оно стоит перед
     кнопкой, а не после. Форма придумана сейчас, разбор целиком лежит
     в `~/dev/seroconnect-план-секций.md`, раздел «СЕКЦИЯ 3».

     ДВА ЗАКОНА, ИЗ КОТОРЫХ ВЫВЕДЕНО ВСЁ ОСТАЛЬНОЕ.

     1. СЕКЦИЯ НЕ ИМЕЕТ ПРАВА ВЫГЛЯДЕТЬ КАК ПЕРЕКЛЮЧАТЕЛЬ. Четыре
        устройства на выбор это та же фигура, что три срока в секции 4.
        Два соседних экрана с рядом меток сделают сайт заикающимся и
        ослабят орган управления четвёртой. Поэтому главная дверь стоит
        ОТДЕЛЬНОЙ строкой, а три остальные уведены вниз и подписаны «на
        другом устройстве»: подпись прямо говорит, что это не варианты
        выбора, а выходы для чужого случая.

     2. СЕКЦИЯ ОБЯЗАНА БЫТЬ ТИХОЙ. Первая секция громкая (число 132),
        вторая это сцена с движением, четвёртая громкая (герой-кнопка).
        Третья стоит вплотную перед героем: зашумит — утопит кнопку.
        На тёмном фоне громкость это ЯРКОСТЬ, а не кегль. Отсюда крупная
        и притушенная главная дверь вместо мелкой и белой.

     СЕКЦИЯ ОТВЕЧАЕТ ЛИЧНО. Сайт определяет систему и показывает одну
     крупную дверь в её инструкцию. Из рассмотренных форм это
     единственная, где секция что-то ДЕЛАЕТ, а не сообщает.

     «Инструкция для Android», а НЕ «у тебя Android». Аудитория покупает
     VPN. Сайт, который за экран до оплаты объявляет, что опознал тебя,
     бьёт по собственной теме. Первая формулировка персональна по делу и
     ничего про человека не утверждает.

     ЗНАК «СЮДА ЖМУТ» — МЕТКИ РЕЗА. Стрелки стояли здесь один заход и
     сняты владельцем 17.09 («полный кал»). Подчёркивание отвергнуто им
     же: искали не универсальный знак, а подходящий сайту.

     Уголки взяты у кнопки покупки, где они живут с 20 августа. Это
     единственный собственный знак сайта для «сюда жмут»: он стоит в
     покое, не требует ни рамки, ни заливки, ни линии. Здесь он мельче и
     тусклее, чем у героя: 12 px против 15, ранг читается сразу.

     Расчёт сверх решения: человек знакомится с уголками на третьей
     секции, а через экран встречает кнопку покупки с теми же уголками и
     уже знает, что это. Метки становятся глаголом сайта, а не
     украшением одной кнопки. Смотреть при этом надо ОДНО: не слабеет ли
     герой оттого, что его знак встречается дважды.

     СКОЛЬКО УГОЛКОВ — РЕШАЕТСЯ ГЛАЗОМ, КЛАВИША M. Развилка настоящая, и
     обе стороны платят. Четыре уголка это тот же знак, что у героя, то
     есть глагол выучен один раз и работает везде, но и различия между
     дверью и кнопкой нет никакого, кроме кегля. Два уголка это тот же
     алфавит, но другое слово: рамка у героя полная, у двери половинная,
     ранг виден мгновенно и знак при этом не ломается.

     Вариант «оба внизу» стоит рядом не для полноты: пара под словом
     читается как обломки подчёркивания, то есть решает ту же задачу
     самым понятным способом, не заводя линии.

     ТРЁМ ОСТАЛЬНЫМ УГОЛКИ НЕ ДАЮТ: четыре обведённых слова это шум. Их
     делает ссылками подпись, которая их называет, «инструкции для
     остальных». Слово «инструкции» работает на все три разом, и ни
     одному не нужен свой знак.

     ПОРЯДОК СБОРКИ ПЕРЕВЁРНУТ. В разметке лежат все четыре двери, и это
     честный вид по умолчанию: он работает без JS, при любой ошибке
     определения и у поисковика. Скрипт не дорисовывает главную дверь, а
     СВОРАЧИВАЕТ три лишние. Секция не может оказаться пустой ни при
     каком сбое: вид без атрибута на корне и есть запасной вид.

     НИ ОДНОГО КАДРА С МИГАНИЕМ. Секция едет в айфрейме внутри склейки,
     и вспышка «четыре строки схлопнулись в одну» прямо перед кнопкой
     покупки недопустима. Решение принимается инлайновым скриптом ниже,
     до первой отрисовки, атрибутом на корне. Дальше всё делает CSS,
     никакой анимации на смене вида нет и быть не должно.

     ПРОМАХ БУДЕТ ВСЕГДА: сидят за виндой, ставят на телефон. Поэтому
     три остальные НИКОГДА не прячутся за «показать все». На десктопе
     вероятность «ставлю не сюда» выше, чем на телефоне, и это довод не
     делать разрыв между главной дверью и остальными слишком большим.

     ЗАПАСНОЙ ВИД — ТА ЖЕ КОМПОЗИЦИЯ, ДРУГАЯ НАЧИНКА. Первый заход
     делал его столбиком из четырёх одинаковых строк, и это был не вид, а
     список. Теперь кадр, раскладка и кегли совпадают до пикселя, меняется
     только КТО стоит в крупной строке: личный ответ («Инструкция для
     Android») или утверждение о продукте. Ни один из двух видов не
     выглядит обрубком другого.

     Уголков в запасном виде нет, и это не упущение: крупная строка там
     не дверь, а утверждение. Метка означает «жмут», и ставить её на то,
     что не жмётся, значит сломать знак в тот же день, когда завели.

     ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ. Поправки на айпэд, который представляется
     маком. Отложена владельцем 17.09 как не относящаяся к первичному
     дизайну, разбор в `BACKLOG.md`. Это дыра, а не недосмотр.

     1 2 3 4 — вид по системе · 0 — вид «не определили»
     ══════════════════════════════════════════════════════════════════ -->
<script>
/* Единственный скрипт, который обязан отработать ДО отрисовки. Сети не
   спрашивает, файлов не ждёт: чистая строка из браузера. */
(function(){
  function определить(){
    /* Современный путь. В Сафари его нет вовсе, поэтому он не
       единственный, а первый. */
    var uad = navigator.userAgentData;
    var p = (uad && uad.platform || '').toLowerCase();
    if (p){
      if (p.indexOf('android') >= 0) return 'android';
      if (p.indexOf('windows') >= 0) return 'win';
      if (p.indexOf('macos')   >= 0) return 'mac';
    }
    var u = navigator.userAgent || '';
    if (/Android/i.test(u))               return 'android';
    if (/iPhone|iPad|iPod/i.test(u))      return 'ios';
    if (/Windows NT/i.test(u))            return 'win';
    /* ВНИМАНИЕ: сюда же попадает айпэд с iOS 13 и новее. Поправка по
       maxTouchPoints отложена в беклог владельцем, см. шапку. */
    if (/Macintosh|Mac OS X/i.test(u))    return 'mac';
    return 'нет';
  }
  var знаю = {ios:1, android:1, mac:1, win:1, 'нет':1};
  var адрес = new URLSearchParams(location.search);
  var ключ = адрес.get('устройство') || адрес.get('os');
  var ос = знаю[ключ] ? ключ : определить();
  /* setAttribute, а не dataset: имя атрибута кириллическое, как и имена
     классов в остальных экранах. */
  document.documentElement.setAttribute('data-ос', ос);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#110a0a;color:#8a8079;
  /* САНС, потому что здесь говорим МЫ. Моно на сайте означает, что
     что-то показывает система: внутри коробки второго экрана, в метках
     сроков четвёртого. Названия платформ это наше утверждение о
     продукте, а не строка чужого интерфейса. */
  font-family:"Onest","Inter",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased}

.col{display:flex;flex-direction:column;align-items:center;
  gap:34px;padding:0 24px;max-width:720px;width:100%}

/* ── ДВЕРИ ──────────────────────────────────────────────────────────
   Одна коробка на оба вида. Запасной вид задан БАЗОВЫМИ правилами, вид
   с определением только добавляет к ним: так запасной получается не
   обработкой ошибки, а состоянием по умолчанию. */
.doors{display:flex;flex-wrap:wrap;justify-content:center;
  align-items:baseline;gap:0 30px;width:100%}

/* Голая ссылка: ни рамки, ни фона, ни подчёркивания. Залитых цветом
   блоков на сайте нет ни одного. */
.door{display:flex;justify-content:center;text-decoration:none;
  color:#6f645c;font-size:15px;line-height:1.25;padding:11px 4px;
  transition:color .15s cubic-bezier(.4,0,.2,1)}
.door:hover,.door:focus-visible{color:#a8917a;outline:0}
/* Коробка под метки. Уголки обязаны обнимать СЛОВА, а не строку во всю
   ширину секции, поэтому они живут не на двери, а внутри неё. */
.цель{position:relative;display:inline-flex;align-items:baseline}
/* Приставка живёт только у главной двери. */
.для{display:none}

/* Крупная строка. В личном виде её занимает главная дверь, в запасном —
   утверждение. Кегль и цвет общие: это одно место кадра. */
.claim,:root[data-ос="ios"]     .door[data-ос="ios"],
       :root[data-ос="android"] .door[data-ос="android"],
       :root[data-ос="mac"]     .door[data-ос="mac"],
       :root[data-ос="win"]     .door[data-ос="win"]{
  font-size:40px;color:#cdc3b8;letter-spacing:-.02em;line-height:1.15}

/* Подписи к ряду имён. Их работа не украшать, а НАЗВАТЬ имена
   инструкциями: без этого «iOS» это просто слово, а не дверь. Заодно
   подпись в личном виде снимает чтение «выбери одно» — там это выходы
   для чужого случая, а не варианты. */
.все,.иначе{font-size:13px;letter-spacing:.05em;color:#4f4741}
.иначе{display:none;width:100%;text-align:center;order:1;padding-top:14px}
.все{margin-top:-20px}

/* ── МЕТКИ РЕЗА ─────────────────────────────────────────────────────
   Знак сайта для «сюда жмут», взятый у кнопки покупки. Держатся только
   на главной двери и только в личном виде. */
.mark{position:absolute;width:12px;height:12px;pointer-events:none;
  display:none;border-color:#d4a57452;border-style:solid;border-width:0;
  transition:transform .14s cubic-bezier(.4,0,.2,1),
             border-color .14s cubic-bezier(.4,0,.2,1)}
.m-tl{top:-16px;left:-30px;border-top-width:1px;border-left-width:1px}
.m-tr{top:-16px;right:-30px;border-top-width:1px;border-right-width:1px}
.m-bl{bottom:-16px;left:-30px;border-bottom-width:1px;border-left-width:1px}
.m-br{bottom:-16px;right:-30px;border-bottom-width:1px;border-right-width:1px}
.door:hover .mark,.door:focus-visible .mark{border-color:#d4a574;
  transition:transform .22s cubic-bezier(.23,1,.32,1),
             border-color .16s cubic-bezier(.23,1,.32,1)}
.door:hover .m-tl,.door:focus-visible .m-tl{transform:translate(4px,4px)}
.door:hover .m-tr,.door:focus-visible .m-tr{transform:translate(-4px,4px)}
.door:hover .m-bl,.door:focus-visible .m-bl{transform:translate(4px,-4px)}
.door:hover .m-br,.door:focus-visible .m-br{transform:translate(-4px,-4px)}

/* СКОЛЬКО УГОЛКОВ. Переключается клавишей M, по умолчанию четыре, как
   у героя. `!important` здесь не лень: показ метки включается правилом
   с весом `:root[атрибут] .door[атрибут] .mark`, перебить его классом на
   теле нечем, а плодить ради просмотра ещё четыре длинных селектора
   бессмысленно. Когда вариант выберут, лишние уголки просто уедут из
   разметки и правило исчезнет. */
body.метки-2 .m-tr,  body.метки-2 .m-bl,
body.метки-низ .m-tl, body.метки-низ .m-tr{display:none!important}

/* ── ЛИЧНЫЙ ВИД ─────────────────────────────────────────────────────
   Четыре правила вместо одного, потому что CSS не умеет сравнивать
   значение на корне со значением на элементе. Зато вид остаётся чистым
   CSS и не требует второго скрипта, который трогал бы разметку после
   разбора документа. */
:root[data-ос="ios"]     .claim,:root[data-ос="ios"]     .все,
:root[data-ос="android"] .claim,:root[data-ос="android"] .все,
:root[data-ос="mac"]     .claim,:root[data-ос="mac"]     .все,
:root[data-ос="win"]     .claim,:root[data-ос="win"]     .все{display:none}

:root[data-ос="ios"]     .иначе,
:root[data-ос="android"] .иначе,
:root[data-ос="mac"]     .иначе,
:root[data-ос="win"]     .иначе{display:block}

:root[data-ос="ios"]     .door,
:root[data-ос="android"] .door,
:root[data-ос="mac"]     .door,
:root[data-ос="win"]     .door{order:2}

:root[data-ос="ios"]     .door[data-ос="ios"],
:root[data-ос="android"] .door[data-ос="android"],
:root[data-ос="mac"]     .door[data-ос="mac"],
:root[data-ос="win"]     .door[data-ос="win"]{order:0;width:100%;
  padding:12px 0;color:#cdc3b8}
:root[data-ос="ios"]     .door[data-ос="ios"]     .для,
:root[data-ос="android"] .door[data-ос="android"] .для,
:root[data-ос="mac"]     .door[data-ос="mac"]     .для,
:root[data-ос="win"]     .door[data-ос="win"]     .для{display:inline}
:root[data-ос="ios"]     .door[data-ос="ios"]     .mark,
:root[data-ос="android"] .door[data-ос="android"] .mark,
:root[data-ос="mac"]     .door[data-ос="mac"]     .mark,
:root[data-ос="win"]     .door[data-ос="win"]     .mark{display:block}

/* ── СПРОСИТЬ ───────────────────────────────────────────────────────
   Живёт ВНУТРИ секции, ниже и мельче. Отдельным экраном делать нельзя:
   между устройствами и покупкой встанет предложение поддержки, то есть
   пауза ровно там, где уходят. Внутри же он превращает отсутствие
   устройства в довод.

   «Ответит человек» сказано от нашего лица (владелец подтвердил
   17.09). На первом экране то же самое живёт цитатой клиента, и
   повторять её здесь чужим голосом было бы слабее. */
.ask{font-size:13px;color:#4f4741;letter-spacing:.02em}
.ask a{color:#6f645c;text-decoration:none;
  border-bottom:1px solid #4f4741;padding-bottom:1px;
  transition:color .15s cubic-bezier(.4,0,.2,1),
             border-color .15s cubic-bezier(.4,0,.2,1)}
.ask a:hover,.ask a:focus-visible{color:#d4a574;border-color:#d4a574;outline:0}

@media (max-width:760px){
  .col{gap:26px}
  .claim,:root[data-ос="ios"]     .door[data-ос="ios"],
         :root[data-ос="android"] .door[data-ос="android"],
         :root[data-ос="mac"]     .door[data-ос="mac"],
         :root[data-ос="win"]     .door[data-ос="win"]{font-size:27px}
  .doors{gap:0 18px}
  .mark{width:9px;height:9px;border-color:#d4a574a6}
  .m-tl,.m-bl{left:-18px}
  .m-tr,.m-br{right:-18px}
  .m-tl,.m-tr{top:-12px}
  .m-bl,.m-br{bottom:-12px}
  .ask{font-size:12px;text-align:center;line-height:1.6}
}

.hint{position:fixed;left:20px;right:20px;bottom:14px;font-size:10px;
  letter-spacing:.08em;line-height:1.7;color:#4f4741;text-align:center}
</style>

<div class="col">

  <p class="claim">Ставится на любом устройстве</p>
  <p class="все">инструкции</p>

  <nav class="doors">

    <a class="door" data-ос="win" href="#" onclick="return false"><span class="цель"

<p class="hint">1 2 3 4 — вид по системе · 0 — вид «не определили» · M — уголки</p>

<script>
/* Только для просмотра. В бою вид ставится один раз, до отрисовки. */
var вид = 0;
addEventListener('keydown', function(e){
  var карта = {'1':'ios','2':'android','3':'mac','4':'win','0':'нет'};
  if (карта[e.key]) document.documentElement.setAttribute('data-ос', карта[e.key]);
  var k = e.key.toLowerCase();
  if (k === 'm' || k === 'ь'){
    var виды = ['', 'метки-2', 'метки-низ'];
    вид = (вид + 1) % виды.length;
    document.body.className = виды[вид];
  }
});
if (new URLSearchParams(location.search).get('v') === 'preview')
  document.querySelector('.hint').remove();
</script>
